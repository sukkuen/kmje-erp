async function dbGet(k) {
  if (db) { try { const d = await db.collection('kmje').doc(k).get(); return d.exists ? JSON.parse(d.data().v) : null; } catch { return null; } }
  try { const v = localStorage.getItem('kmje_' + k); return v ? JSON.parse(v) : null; } catch { return null; }
}
async function dbSet(k, val) {
  if (db) { try { await db.collection('kmje').doc(k).set({v: JSON.stringify(val)}); } catch(e){console.error(e);} }
  else { localStorage.setItem('kmje_' + k, JSON.stringify(val)); }
}
function dbListen(k, cb) {
  if (db) return db.collection('kmje').doc(k).onSnapshot(d => { if(d.exists) cb(JSON.parse(d.data().v)); });
  return null;
}

function ExpandedDetail({order,onUpdate}){
  const E=React.createElement;
  const GISENG=['1차기성','2차기성','3차기성','4차기성','5차기성'];
  const setP=(i,f,v)=>{const p=order.payments.map((x,j)=>j===i?{...x,[f]:v}:x);onUpdate({...order,payments:p});};
  const setSP=(sid,pi,f,v)=>{const s=order.subcontractors.map(s=>s.id!==sid?s:{...s,payments:s.payments.map((x,j)=>j===pi?{...x,[f]:v}:x)});onUpdate({...order,subcontractors:s});};
  const delP=id=>{onUpdate({...order,payments:order.payments.filter(p=>p.id!==id)});};
  const addGiseng=()=>{
    const existing=order.payments.filter(p=>GISENG.includes(p.type)).map(p=>p.type);
    const next=GISENG.find(g=>!existing.includes(g));
    if(!next){alert('더 이상 기성을 추가할 수 없습니다 (최대 5차)');return;}
    const idx=order.payments.findIndex(p=>p.type==='잔금');
    const newP=mkP(next,0);
    const payments=idx>=0?[...order.payments.slice(0,idx),newP,...order.payments.slice(idx)]:[...order.payments,newP];
    onUpdate({...order,payments});
  };
  const pSt=p=>{if(p.receivedDate)return['입금완료','b-green'];if(p.invoiceDate)return['발행완료','b-blue'];return['미발행','b-gray'];};
  const sSt=p=>{if(p.paidDate)return['지급완료','b-green'];if(p.invoiceDate)return['계산서수취','b-blue'];return['미수취','b-gray'];};

  const sf=(k,v)=>setF(x=>({...x,[k]:v}));

    const cl=(clients||[]).find(c=>c.name===clientName);
    if(!cl)return f.orderNo;
    const yr=new Date().getFullYear().toString().slice(2);

    let maxSeq=0;
    (orders||[]).forEach(o=>{
      const no=o.orderNo||'';
      const parts=no.split('-');
      if(parts.length===2){const seq=parseInt(parts[1]||'0');if(seq>maxSeq)maxSeq=seq;}

// ── YearSelect ────────────────────────────────────────────
function YearSelect({orders,onSelect}){
  const E=React.createElement;
  const years=[...new Set(orders.map(o=>o.startDate?.slice(0,4)||'미정'))].sort((a,b)=>b.localeCompare(a));
  if(years.length===0)years.push(String(new Date().getFullYear()));
  return E('div',null,
    E('div',{style:{fontSize:14,fontWeight:700,marginBottom:16}},'수주현황 — 연도 선택'),
    E('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12}},
      ...years.map(yr=>{
        const yrOrders=orders.filter(o=>(o.startDate?.slice(0,4)||'미정')===yr);
        const cnt=yrOrders.length;
        const totKRW=yrOrders.filter(o=>o.currency!=='USD').reduce((s,o)=>s+(o.projectAmount||0),0);
        const totUSD=yrOrders.filter(o=>o.currency==='USD').reduce((s,o)=>s+(o.projectAmount||0),0);
        return E('div',{key:yr,onClick:()=>onSelect(yr),style:{background:'#fff',border:'1px solid #e2e8f0',borderRadius:10,padding:'20px 16px',cursor:'pointer',textAlign:'center',transition:'box-shadow .15s'},
          onMouseEnter:e=>{e.currentTarget.style.boxShadow='0 4px 12px rgba(30,64,175,.15)';e.currentTarget.style.borderColor='#1e40af';},
          onMouseLeave:e=>{e.currentTarget.style.boxShadow='';e.currentTarget.style.borderColor='#e2e8f0';}},
          E('div',{style:{fontSize:28,fontWeight:700,color:'#1e40af',marginBottom:6}},yr+'년'),
          E('div',{style:{fontSize:13,color:'#64748b',marginBottom:4}},cnt+'건'),
          E('div',{style:{fontSize:12,color:'#94a3b8',marginBottom:totUSD>0?2:0}},totKRW?abbr(totKRW)+'원':'-'),
          totUSD>0&&E('div',{style:{fontSize:12,color:'#059669',fontWeight:600}},'$'+Number(totUSD).toLocaleString('en-US'))
        );
      })
    )
  );
}

function ClientList({clients,saveClients,orders,saveOrders}){
  const E=React.createElement;
  const[modal,setModal]=useState(null);
  const[srch,setSrch]=useState("");
  const filtered=(clients||[]).filter(c=>c.name.includes(srch)||c.code.includes(srch)||(c.phone||"").includes(srch));
  const del=id=>{if(window.confirm("삭제하시겠습니까?"))saveClients(clients.filter(c=>c.id!==id));};
  const save=cl=>{
    const existing=clients.find(x=>x.id===cl.id);
    if(existing){
      // 이름이 바뀐 경우 수주현황 거래처명도 일괄 업데이트
      if(existing.name!==cl.name&&orders&&saveOrders){
        const updatedOrders=orders.map(o=>o.clientName===existing.name?{...o,clientName:cl.name}:o);
        saveOrders(updatedOrders);
      }
      saveClients(clients.map(x=>x.id===cl.id?cl:x));

      saveClients([...clients,{...cl,id:uid()}]);
    }
    setModal(null);
  };

    modal&&E(ClientModal,{client:modal==="new"?null:modal,onSave:save,onClose:()=>setModal(null)}),

            let updateCount=0;

              const exact=clients.find(cl=>cl.name===o.clientName);
              if(exact)return o;
              const orderCode=(o.orderNo||"").slice(2,4);

            if(updateCount===0){alert("동기화할 항목이 없습니다. 모든 거래처명이 일치합니다.");}

  const rmExp=id=>sc({expenses:(cf.expenses||[]).filter(e=>e.id!==id)});
  const upExp=(id,k,v)=>sc({expenses:(cf.expenses||[]).map(e=>e.id===id?{...e,[k]:v}:e)});

  const changePw=()=>{const np=window.prompt('새 비밀번호 입력:','');if(np!==null&&np.trim()!==''){savePw(np.trim());alert('변경 완료!');}};
  const iS={background:'#f8fafc',border:'1px solid #e2e8f0',borderRadius:5,padding:'5px 8px',color:'#1e293b',fontSize:12,fontFamily:'inherit',outline:'none',width:'100%'};

  const totExpected=totExp+totMonthly;
  const netFlow=totCur-totExpected;

  return E('div',null,
    E('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}},
      E('div',{style:{fontSize:14,fontWeight:700}},'현금흐름'),
      E('div',{style:{display:'flex',gap:8}},
        E('button',{className:'btn sm',onClick:changePw},'비밀번호 변경'),
        E('button',{className:'btn sm',onClick:onLock,style:{color:'#dc2626'}},'잠금')
      )
    ),
    E('div',{className:'month-tabs'},...months.map(m=>E('button',{key:m,onClick:()=>setSel(m),className:'m-tab'+(sel===m?' on':'')},m.slice(5)+'월'))),
    E('div',{className:'kpis',style:{gridTemplateColumns:'repeat(5,1fr)',marginBottom:14}},
      ...[
        ['당월 수입 (미입금)',abbr(totCur)+'원','당월 이전 발행 · 미입금 전체','#059669'],
        ['당월 예상 지출',abbr(totExpected)+'원','지출합계 + 월이자','#d97706'],
        ['익월 예상 수입',abbr(totNxt)+'원','당월 발행 기준','#1e40af'],
        ['당월 수지',(netFlow>=0?'+':'')+abbr(netFlow)+'원','당월수입 - 당월예상지출',netFlow>=0?'#059669':'#dc2626']
      ].map(([l,v,s,color],i)=>E('div',{key:i,className:'kpi'},
        E('div',{className:'kpi-lbl'},l),
        E('div',{className:'kpi-val',style:{color}},v),
        E('div',{className:'kpi-sub'},s)
      )),
      (()=>{
        const safe=netFlow>=0||(totBk+netFlow>=0);
        const deficit=netFlow<0?Math.abs(netFlow):0;
        const coverPct=deficit>0?Math.min(100,Math.round(totBk/deficit*100)):100;
        return E('div',{className:'kpi',style:{border:'2px solid '+(safe?'#059669':'#dc2626'),background:safe?'#f0fdf4':'#fff1f2'}},
          E('div',{className:'kpi-lbl',style:{color:safe?'#059669':'#dc2626',fontWeight:600}},safe?'✅ 자금 안정':'⚠️ 자금 위험'),
          E('div',{style:{fontSize:22,fontWeight:700,color:safe?'#059669':'#dc2626',marginBottom:2}},
            safe?(netFlow>=0?'수입 > 지출':'잔고로 커버 가능'):'잔고 부족'
          ),
          E('div',{style:{fontSize:11,color:'#64748b'}},
            netFlow>=0
              ?'당월 수지 플러스'
              :'부족분 '+abbr(deficit)+'원 / 잔고 커버율 '+coverPct+'%'
          )
        );
      })()
    ),
    E('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}},
      E('div',null,
        E('div',{className:'card',style:{marginBottom:14}},
          E('div',{className:'card-hdr',style:{color:'#059669'}},sel.slice(5)+'월 당월 수입 (미입금 전체)'),
          E('div',{style:{padding:'10px 12px'}},
            curInc.length===0
              ?E('div',{style:{fontSize:12,color:'#94a3b8',padding:'8px 0'}},'미입금 건이 없습니다 ✓')
              :E('table',null,
                E('thead',null,E('tr',null,...['거래처','수행내용','발행일','금액'].map(h=>E('th',{key:h,style:h==='금액'?{textAlign:'right'}:{}},h)))),
                E('tbody',null,
                  ...curInc.map((x,i)=>E('tr',{key:i},
                    E('td',{style:{fontWeight:500}},x.name),
                    E('td',{style:{color:'#64748b',fontSize:11,maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},x.desc),
                    E('td',{style:{fontSize:11,color:'#64748b'}},x.date?.slice(5)),
                    E('td',{className:'mono',style:{textAlign:'right'}},fmtCur(x.amount,x.currency))
                  )),
                  E('tr',null,E('td',{colSpan:3,style:{fontWeight:600}},'합계'),E('td',{className:'mono',style:{textAlign:'right',fontWeight:700,color:'#059669'}},fmt(totCur)+'원'))
                )
              )
          )
        ),
        E('div',{className:'card'},
          E('div',{className:'card-hdr',style:{color:'#1e40af'}},'익월 예상 수입'),
          E('div',{style:{padding:'10px 12px'}},
            nxtInc.length===0
              ?E('div',{style:{fontSize:12,color:'#94a3b8',padding:'8px 0'}},'당월 발행 계산서 없음')
              :E('table',null,
                E('thead',null,E('tr',null,...['거래처','수행내용','발행일','금액'].map(h=>E('th',{key:h,style:h==='금액'?{textAlign:'right'}:{}},h)))),
                E('tbody',null,
                  ...nxtInc.map((x,i)=>E('tr',{key:i},
                    E('td',{style:{fontWeight:500}},x.name),
                    E('td',{style:{color:'#64748b',fontSize:11,maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},x.desc),
                    E('td',{style:{fontSize:11,color:'#64748b'}},x.date?.slice(5)),
                    E('td',{className:'mono',style:{textAlign:'right'}},fmtCur(x.amount,x.currency))
                  )),
                  E('tr',null,E('td',{style:{fontWeight:600}},'합계'),E('td'),E('td'),E('td',{className:'mono',style:{textAlign:'right',fontWeight:700,color:'#1e40af'}},fmt(totNxt)+'원'))
                )
              )
          )
        )
      ),
      E('div',null,
        E('div',{className:'card',style:{marginBottom:14}},
          E('div',{className:'card-hdr',style:{color:'#d97706'}},'지출'),
          E('div',{style:{padding:'10px 12px'}},
            E('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:8}},
              E('span',{style:{fontSize:12,minWidth:90,color:'#64748b'}},'인건비'),
              E(FmtInput,{value:cf.laborCost||0,onChange:v=>sc({laborCost:v}),style:{...iS,flex:1}}),
              E('span',{style:{fontSize:11,color:'#64748b',minWidth:60,textAlign:'right'}},abbr(cf.laborCost||0))
            ),
            ...(cf.expenses||[]).map(e=>E('div',{key:e.id,style:{display:'flex',gap:5,marginBottom:5,alignItems:'center'}},
              E('input',{style:{...iS,flex:2},placeholder:'항목명',value:e.name,onChange:ev=>upExp(e.id,'name',ev.target.value)}),
              E(FmtInput,{value:e.amount||0,onChange:v=>upExp(e.id,'amount',v),style:{...iS,flex:1}}),
              E('input',{type:'date',style:{...iS,flex:1},value:e.due||'',onChange:ev=>upExp(e.id,'due',ev.target.value)}),
              E('button',{className:'btn sm dng',onClick:()=>rmExp(e.id)},'✕')
            )),
            E('button',{className:'btn sm',style:{marginTop:4},onClick:addExp},'+ 항목 추가'),
            E('div',{style:{display:'flex',justifyContent:'flex-end',paddingTop:8,marginTop:8,borderTop:'1px solid #f1f5f9',fontSize:12,fontWeight:600,color:'#d97706'}},'합계: '+fmt(totExp)+'원')
          )
        ),
        E('div',{className:'card',style:{marginBottom:14}},
          E('div',{className:'card-hdr',style:{flexWrap:'wrap',gap:6}},
            E('span',null,'은행 잔고'),
            E('div',{style:{display:'flex',alignItems:'center',gap:6,marginLeft:'auto'}},
              E('span',{style:{fontSize:11,color:'#94a3b8'}},'기준일시:'),
              E('input',{type:'datetime-local',
                value:cf.bankBaseDate||'',
                onChange:e=>sc({bankBaseDate:e.target.value}),
                style:{fontSize:11,padding:'2px 6px',border:'1px solid #e2e8f0',borderRadius:5,color:'#64748b',fontFamily:'inherit',background:'#f8fafc',outline:'none'}
              }),
              E('button',{className:'btn sm',onClick:addBank},'+ 추가')
            )
          ),
          E('div',{style:{padding:'10px 12px'}},
            ...(cf.banks||[]).map(b=>E('div',{key:b.id,style:{display:'flex',gap:6,marginBottom:6,alignItems:'center'}},
              E('input',{style:{...iS,flex:2},placeholder:'은행명',value:b.name,onChange:e=>upBank(b.id,'name',e.target.value)}),
              E(FmtInput,{value:b.balance||0,onChange:v=>upBank(b.id,'balance',v),style:{...iS,flex:1}}),
              E('button',{className:'btn sm dng',onClick:()=>rmBank(b.id)},'✕')
            )),
            E('div',{style:{display:'flex',justifyContent:'flex-end',paddingTop:6,borderTop:'1px solid #f1f5f9',fontSize:12,fontWeight:600,color:'#1e40af'}},'합계: '+fmt(totBk)+'원')
          )
        ),
        E('div',{className:'card'},
          E('div',{className:'card-hdr'},
            E('span',null,'대출 현황'),
            E('button',{className:'btn sm',onClick:addLoan,style:{marginLeft:'auto'}},'+ 추가')
          ),
          E('div',{style:{padding:'10px 12px'}},
            ...(cf.loans||[]).map(l=>{
              const bal=(l.principal||0)-(l.repaid||0);
              const monthly=calcMonthly(l.principal,l.repaid,l.rate);
              return E('div',{key:l.id,style:{background:'#f8fafc',borderRadius:8,padding:10,marginBottom:8,border:'1px solid #e2e8f0'}},
                E('div',{style:{display:'flex',gap:6,marginBottom:6,alignItems:'center'}},
                  E('input',{style:{...iS,flex:2},placeholder:'대출명',value:l.name,onChange:e=>upLoan(l.id,'name',e.target.value)}),
                  E('button',{className:'btn sm dng',onClick:()=>rmLoan(l.id)},'✕')
                ),
                E('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,marginBottom:6}},
                  E('div',null,E('div',{style:{fontSize:10,color:'#94a3b8',marginBottom:2}},'대출원금'),E(FmtInput,{value:l.principal||0,onChange:v=>upLoan(l.id,'principal',v),style:iS})),
                  E('div',null,E('div',{style:{fontSize:10,color:'#94a3b8',marginBottom:2}},'상환액 누계'),E(FmtInput,{value:l.repaid||0,onChange:v=>upLoan(l.id,'repaid',v),style:iS})),
                  E('div',null,E('div',{style:{fontSize:10,color:'#94a3b8',marginBottom:2}},'이자율 (연%)'),E('input',{type:'number',style:iS,step:'0.1',value:l.rate||0,onChange:e=>upLoan(l.id,'rate',Number(e.target.value))})),
                  E('div',null,E('div',{style:{fontSize:10,color:'#94a3b8',marginBottom:2}},'만기일'),E('input',{type:'date',style:iS,value:l.dueDate||'',onChange:e=>upLoan(l.id,'dueDate',e.target.value)}))
                ),
                E('div',{style:{display:'flex',justifyContent:'space-between',paddingTop:6,borderTop:'1px solid #e2e8f0',fontSize:11}},
                  E('span',{style:{color:'#64748b'}},'대출잔액: ',E('strong',{style:{color:'#dc2626'}},fmt(bal)+'원')),
                  E('span',{style:{color:'#64748b'}},'월이자: ',E('strong',{style:{color:'#dc2626'}},fmt(monthly)+'원'))
                )
              );
            }),
            E('div',{style:{display:'flex',justifyContent:'space-between',paddingTop:8,borderTop:'1px solid #f1f5f9',fontSize:12,fontWeight:600}},
              E('span',{style:{color:'#dc2626'}},'대출잔액 합계: '+fmt(totLoanBal)+'원'),
              E('span',{style:{color:'#d97706'}},'월이자 합계: '+fmt(totMonthly)+'원')
            )
          )
        )
      )
    ),
    E('div',{className:'card',style:{marginTop:14}},
      E('div',{className:'card-hdr',style:{color:'#dc2626'}},
        E('span',null,'⚠️ 세금계산서 미발행 목록'),
        E('span',{style:{fontSize:11,color:'#94a3b8',fontWeight:400,marginLeft:8}},unpaidInv.length+'건')
      ),
      unpaidInv.length===0
        ?E('div',{style:{padding:'16px',fontSize:12,color:'#94a3b8',textAlign:'center'}},'미발행 건이 없습니다 ✓')
        :E('div',{style:{overflowX:'auto'}},
          E('table',null,
            E('thead',null,E('tr',null,
              ...['수주번호','거래처','수행내용','구분','금액','완료예정','담당'].map(h=>E('th',{key:h,style:h==='금액'?{textAlign:'right'}:{}},h))
            )),
            E('tbody',null,
              ...unpaidInv.map((x,i)=>E('tr',{key:i},
                E('td',{className:'mono',style:{fontSize:11,color:'#1e40af'}},x.orderNo),
                E('td',{style:{fontWeight:500}},x.clientName),
                E('td',{style:{color:'#64748b',fontSize:11,maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},x.desc),
                E('td',null,E('span',{className:'badge b-gray'},x.type)),
                E('td',{className:'mono',style:{textAlign:'right'}},fmtCur(x.amount,x.currency)),
                E('td',{style:{fontSize:11,color:x.endDate&&x.endDate<todayStr?'#dc2626':'#64748b'}},x.endDate||'미정'),
                E('td',null,E('span',{className:'badge b-gray'},x.manager))
              )),
              E('tr',{style:{background:'#fef2f2'}},
                E('td',{colSpan:4,style:{fontWeight:600,padding:'8px 12px'}},'미발행 합계'),
                E('td',{className:'mono',style:{textAlign:'right',fontWeight:700,color:'#dc2626',padding:'8px 12px'}},
                  fmt(unpaidKRW)+'원'+(unpaidUSD>0?' / $'+unpaidUSD.toLocaleString('en-US'):'')
                ),
                E('td'),E('td')
              )
            )
          )
        )
    )
  );
}


// ── App ──────────────────────────────────────────────────
function App(){
  const E=React.createElement;
  const[tab,setTab]=useState("dashboard");
  const[orders,setOrders]=useState(null);
  const[clients,setClients]=useState(null);
  const[cfData,setCfData]=useState({});
  const[managers,setManagers]=useState(null);
  const[cfUnlocked,setCfUnlocked]=useState(false);
  const[showPwModal,setShowPwModal]=useState(false);
  const[showMgrModal,setShowMgrModal]=useState(false);
  const[cfPassword,setCfPassword]=useState("1234");

  useEffect(()=>{
    if(!FB_OK){
      Promise.all([dbGet("orders"),dbGet("clients"),dbGet("cashflow"),dbGet("settings")]).then(([o,cl,cf,st])=>{
        setOrders(o||INIT);
        setClients(cl||INIT_CLIENTS);
        setCfData(cf||{});
        if(st&&st.cfPassword)setCfPassword(st.cfPassword);
        if(st&&st.managers)setManagers(st.managers); else setManagers(INIT_MANAGERS);
      });
      return;
    }
    const u1=dbListen("orders",o=>setOrders(o));
    const u2=dbListen("clients",cl=>setClients(cl));
    const u3=dbListen("cashflow",cf=>setCfData(cf));
    const u4=dbListen("settings",st=>{
      if(st&&st.cfPassword)setCfPassword(st.cfPassword);
      if(st&&st.managers)setManagers(st.managers);
    });
    Promise.all([dbGet("orders"),dbGet("clients"),dbGet("cashflow"),dbGet("settings")]).then(([o,cl,cf,st])=>{
      if(!o)dbSet("orders",INIT).then(()=>setOrders(INIT)); else setOrders(o);
      if(!cl)dbSet("clients",INIT_CLIENTS).then(()=>setClients(INIT_CLIENTS)); else setClients(cl);
      setCfData(cf||{});
      const pw=(st&&st.cfPassword)||"1234";
      const mgrs=(st&&st.managers)||INIT_MANAGERS;
      setCfPassword(pw);
      setManagers(mgrs);
      if(!st)dbSet("settings",{cfPassword:pw,managers:mgrs});
    });
    return()=>{if(u1)u1();if(u2)u2();if(u3)u3();if(u4)u4();};
  },[]);

  const saveO=o=>{setOrders(o);dbSet("orders",o);};
  const saveCl=cl=>{setClients(cl);dbSet("clients",cl);};
  const saveCf=cf=>{setCfData(cf);dbSet("cashflow",cf);};
  const savePw=pw=>{setCfPassword(pw);dbSet("settings",{cfPassword:pw,managers:managers||INIT_MANAGERS});};
  const saveMgrs=mgrs=>{setManagers(mgrs);dbSet("settings",{cfPassword,managers:mgrs});setShowMgrModal(false);};

  const handleTab=id=>{
    if(id==="cashflow"&&!cfUnlocked){setShowPwModal(true);return;}
    setTab(id);
  };

  const mgrs=managers||INIT_MANAGERS;

  if(!FB_OK)return E(SetupScreen,null);
  if(!orders||!clients||!managers)return E("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:"#64748b"}},"로딩 중...");

  const tabs=[
    {id:"dashboard",label:"대시보드"},
    {id:"clients",label:"거래처 관리"},
    {id:"orders",label:"수주현황"},
    {id:"cashflow",label:"현금흐름"},
  ];

  return E("div",null,
    showPwModal&&E(PasswordModal,{password:cfPassword,onSuccess:()=>{setCfUnlocked(true);setShowPwModal(false);setTab("cashflow");},onClose:()=>setShowPwModal(false)}),
    showMgrModal&&E(ManagerModal,{managers:mgrs,onSave:saveMgrs,onClose:()=>setShowMgrModal(false)}),
    E("div",{className:"hdr"},
      E("div",{className:"hdr-inner"},
        E("div",{className:"logo"},E("img",{src:"logo.png",alt:"KMJE"}),"케이엠제이 수주관리"),
        ...tabs.map(t=>E("button",{key:t.id,onClick:()=>handleTab(t.id),className:"tab"+(tab===t.id?" on":"")},t.label)),
        E("button",{className:"btn sm",onClick:()=>setShowMgrModal(true),style:{marginLeft:"auto",marginRight:8}},"담당자 관리"),
        E("span",{className:"sync-badge "+(FB_OK?"sync-live":"sync-local")},FB_OK?"실시간 공유":"로컬 모드")
      )
    ),
    E("div",{className:"main"},
      tab==="dashboard"&&E(Dashboard,{orders}),
      tab==="clients"&&E(ClientList,{clients,saveClients:saveCl,orders,saveOrders:saveO}),
      tab==="orders"&&E(OrderList,{orders,saveOrders:saveO,managers:mgrs,clients}),
      tab==="cashflow"&&E(CashFlow,{orders,cfData,saveCf,cfPassword,savePw,onLock:()=>{setCfUnlocked(false);setTab("dashboard");}})
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
