const FIREBASE_CONFIG = {

  try { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.firestore(); }

async function dbGet(k) {
  if (db) { try { const d = await db.collection('kmje').doc(k).get(); return d.exists ? JSON.parse(d.data().v) : null; } catch { return null; } }
  try { const v = localStorage.getItem('kmje_' + k); return v ? JSON.parse(v) : null; } catch { return null; }
}
async function dbSet(k, val) {
  if (db) { try { await db.collection('kmje').doc(k).set({v: JSON.stringify(val)}); } catch(e){console.error(e);} }
  else { localStorage.setItem('kmje_' + k, JSON.stringify(val)); }
}
function dbListen(k, cb) {
  if (db) return db.collection('kmje').doc(k).onSnapshot(d => { if(d.exists) cb(JSON.parse(d.data().v)); });
  return null;
}

const {useState,useEffect,useRef,Fragment} = React;
const uid = () => Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const fmt = n => Number(n||0).toLocaleString('ko-KR');
const abbr = n => { n=Number(n||0); if(!n)return'0'; if(n>=1e8)return(n/1e8).toFixed(1)+'억'; if(n>=1e7)return Math.round(n/1e7)+'천만'; if(n>=1e4)return Math.round(n/1e4)+'만'; return fmt(n); };
const fmtCur = (n,cur) => cur==='USD' ? '$'+Number(n||0).toLocaleString('en-US') : fmt(n)+'원';
// 콤마 포맷 입력 컴포넌트
function FmtInput({value,onChange,style,placeholder,step}){
  const[focused,setFocused]=React.useState(false);
  const E=React.createElement;
  const display=focused?String(value||''):value?Number(value).toLocaleString('ko-KR'):'';
  return E('input',{
    type:focused?'number':'text',
    value:display,
    placeholder:placeholder||'',
    step:step||'1',
    style:{...style,textAlign:'right'},
    onFocus:e=>{setFocused(true);setTimeout(()=>e.target.select(),0);},
    onBlur:()=>setFocused(false),
    onChange:e=>onChange(e.target.value===''?0:Number(e.target.value))
  });
}
const abbrCur = (n,cur) => cur==='USD' ? '$'+Number(n||0).toLocaleString('en-US') : abbr(n)+'원';
const ym = s => s?.slice(0,7)??null;
const _ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today = _ymd(new Date());
const thisM = today.slice(0,7);
const prevM = (()=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return _ymd(d).slice(0,7);})();
const todayStr = today;
const PAY_TYPES = ["계약금","1차기성","2차기성","3차기성","4차기성","5차기성","잔금"];
const INIT_MANAGERS = ["김경래","이충영","조용집","박명호","고석근","이일섭"];
const mkP = (type,amount,inv=false,invD=null,recD=null) => ({id:uid(),type,amount:amount||0,invoiceIssued:!!inv,invoiceDate:invD,receivedDate:recD,paidDate:null});
const oBalance = o => (o.projectAmount||0) - o.payments.filter(p=>p.receivedDate).reduce((s,p)=>s+(p.amount||0),0);
// 수주번호 뒤 일련번호(등록순) 추출. 예: "2643-004" → 4
const orderSeq = o => { const p=(o.orderNo||'').split('-'); return p.length===2 ? (parseInt(p[1])||0) : 0; };
// 주어진 날짜의 익월 말일 (YYYY-MM-DD). 예: 2026-07-15 → 2026-08-31
const lastDayNextMonth = ds => {
  if(!ds) return '';
  const d=new Date(ds); if(isNaN(d)) return '';
  const last=new Date(d.getFullYear(), d.getMonth()+2, 0);
  const mm=String(last.getMonth()+1).padStart(2,'0'), dd=String(last.getDate()).padStart(2,'0');
  return last.getFullYear()+'-'+mm+'-'+dd;
};
// ── 계약서 관련 ──
const KMJE_INFO = { name:'㈜케이엠제이', bizNo:'', ceo:'고명진', address:'충청남도 천안시 동남구 성남면 5산단2로 120' };
// 숫자 → 한글금액 (일금 ○○○원정)
const _hanNum = n => {
  n=Math.floor(Math.abs(Number(n)||0)); if(n===0) return '영';
  const d1=['','일','이','삼','사','오','육','칠','팔','구'], d10=['','십','백','천'], d4=['','만','억','조','경'];
  let res='', g=0;
  while(n>0){ let part=n%10000; n=Math.floor(n/10000); if(part>0){ let s='',p=part,pos=0; while(p>0){ const dg=p%10; if(dg>0) s=d1[dg]+d10[pos]+s; p=Math.floor(p/10); pos++; } res=s+d4[g]+res; } g++; }
  return res;
};
const amountKor = n => '일금 '+_hanNum(n)+'원정';
// 계약 종류별 지체상금 분자 (계약금액의 1000분의 N)
const DELAY_RATE = { client:1, vendor:3 };
// 조항 기본값 (종류·하자보증기간 반영, 발주자/수주자 라벨 공용)
const defaultClauses = (type, defectMonths) => {
  const r = DELAY_RATE[type]||1;
  const dm = defectMonths||12;
  return [
    ['계약','"발주자"와 "수주자"는 상기 계약내용의 금액을 승인하고 상호 신뢰와 성실로써 본 계약을 이행한다.'],
    ['대금지급','"수주자"는 납품 기일 내에 공사 완료 또는 시설 설치 완료 후 "수주자"의 대금 청구에 의하며, "발주자"는 검수하여 대금을 지급한다.'],
    ['운반설치','"수주자"는 "발주자"가 지정하는 장소까지 "수주자"의 부담으로 운반하여 설치한다.'],
    ['사전승인','"수주자"는 설계도, 소요자재, 재질, 공정도 및 사양서, 시방서, 사용설명서 등을 "발주자"에게 사전에 제출하여 승인받아야 한다.'],
    ['양도금지','"수주자"는 "발주자"의 승인 없이 본 계약에서 발생되는 권리와 의무, 담보 및 저당권 설정 등으로 제3자에게 양도·승계할 수 없다.'],
    ['변경승인 및 중간검수','제4조의 내용을 변경하고자 할 때 "수주자"는 "발주자"에게 사전 통보하고 반드시 "발주자"의 승인 하에 시행하여야 하며, 본 계약 시 제시된 소요 자재의 재질·규격·용량 등을 중간 검수한 결과 부적합하게 시공·제작하였을 때는 재제작 및 재시공하여야 하고, 이로 인하여 추가 소요되는 제반비용 일체를 "수주자"가 부담한다.'],
    ['납품','"수주자"가 납품 시에는 생산과정·품질·검사서 등을 제출하여야 하며, 납품 전이라도 "발주자"는 수시로 "수주자"의 공장을 방문하여 중간검수를 할 수 있고 "수주자"는 납품일을 준수하여야 한다.'],
    ['연장·중지','천재지변 및 불가항력으로 인하여 납기에 영향을 미치는 상황이 발생하였을 때 "수주자"는 지체 없이 그 사유를 "발주자"에게 통보하고 상호 협의에 의하여 납기를 연장 또는 중지할 수 있다.'],
    ['지체상금','"수주자"의 일방적인 사정으로 납품기일 내에 납품하지 못할 경우에는 지연일수 1일에 대하여 계약금액의 1000분의 '+r+'에 해당하는 지체상금을 잔금에서 공제한다.'],
    ['중도해약','다음 각 호에 해당할 때는 본 계약을 중도에 해약할 수 있다.\n 1) "수주자"의 귀책사유로 납기 내 또는 경과 후 상당한 시일이 소요되어 계약 이행이 불가능하다고 인정될 때\n 2) 정당한 사유 없이 착수시기를 지연시키고 계약을 이행하지 않을 때\n 3) 제출된 설계도와 상이하게 제작·시공하고 있을 때'],
    ['손해배상','제10조에 의거 계약 해지 시에는 "수주자"는 "발주자"에게 계약금액의 10%를 손해 배상하여야 한다.'],
    ['하자이행','하자이행기간은 설비 납품 후 또는 공사 완료 후 상기 "5. 하자이행증권"에 명시한 하자보증기간으로 하며, "수주자"가 시공 또는 제작 불량으로 인한 하자가 발생 시는 지체 없이 이를 "수주자"의 부담으로 보수하여야 한다.'],

};
// 계약서 문서번호 생성 (KMJ-YYMMDD-NN)
const makeContractNo = (contracts, dateStr) => {
  const ymd=(dateStr||today).replace(/-/g,'').slice(2); // YYMMDD
  const n=(contracts||[]).filter(c=>(c.contractNo||'').indexOf('KMJ-'+ymd+'-')===0).length+1;
  return 'KMJ-'+ymd+'-'+String(n).padStart(2,'0');
};
// 수주의 계산서 발행 요약 배지 상태 (요청 > 부분발행 순으로 표시)
const invSummary = o => {
  const ps = o.payments||[];
  const total = ps.length;
  if(total===0) return {label:'—', cls:'none'};
  const issued = ps.filter(p=>p.invoiceDate).length;
  const reqCount = ps.filter(p=>p.invoiceRequested && !p.invoiceDate).length;
  if(issued===total) return {label:'전체발행', cls:'b-green'};
  if(reqCount>0) return {label:'요청 '+reqCount, cls:'b-yellow'};
  if(issued>0) return {label:issued+'/'+total, cls:'b-amber'};
  return {label:'미발행', cls:'b-gray'};
};
const sUnpaid = s => (s.contractAmount||0) - s.payments.filter(p=>p.paidDate).reduce((s2,p)=>s2+(p.amount||0),0);
// SheetJS(xlsx) 지연 로드 — 엑셀 내보내기 클릭 시 최초 1회만 CDN에서 로드
let _xlsxPromise=null;
const loadXLSX=()=>{
  if(window.XLSX)return Promise.resolve(window.XLSX);
  if(_xlsxPromise)return _xlsxPromise;
  _xlsxPromise=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=()=>resolve(window.XLSX);
    s.onerror=()=>reject(new Error('엑셀 라이브러리 로드 실패 (인터넷 연결 확인)'));
    document.head.appendChild(s);
  });
  return _xlsxPromise;
};

// ── ExpandedDetail ───────────────────────────────────────
function ExpandedDetail({order,onUpdate}){
  const E=React.createElement;
  const GISENG=['1차기성','2차기성','3차기성','4차기성','5차기성'];
  const setP=(i,f,v)=>{const p=order.payments.map((x,j)=>j===i?{...x,[f]:v}:x);onUpdate({...order,payments:p});};
  const setSP=(sid,pi,f,v)=>{const s=order.subcontractors.map(s=>s.id!==sid?s:{...s,payments:s.payments.map((x,j)=>j===pi?{...x,[f]:v}:x)});onUpdate({...order,subcontractors:s});};
  // 협력업체 예상지출일 자동제안: 같은 구분의 발주처 수금일(입금∥예상) → 익월 말일
  const subAutoExpect=(sid,pi,subPayType)=>{
    const match=(order.payments||[]).find(p=>p.type===subPayType&&(p.expectedDate||p.receivedDate));
    let ref=match&&(match.receivedDate||match.expectedDate);
    if(!ref){const ds=(order.payments||[]).map(p=>p.receivedDate||p.expectedDate).filter(Boolean).sort();ref=ds[0];}
    if(!ref){alert('먼저 발주처 결제항목에 예상수금일(또는 입금일)을 입력하세요.');return;}
    setSP(sid,pi,'expectedPayDate',lastDayNextMonth(ref));
  };
  const delP=id=>{onUpdate({...order,payments:order.payments.filter(p=>p.id!==id)});};
  const addGiseng=()=>{
    const existing=order.payments.filter(p=>GISENG.includes(p.type)).map(p=>p.type);
    const next=GISENG.find(g=>!existing.includes(g));
    if(!next){alert('더 이상 기성을 추가할 수 없습니다 (최대 5차)');return;}
    const idx=order.payments.findIndex(p=>p.type==='잔금');
    const newP=mkP(next,0);
    const payments=idx>=0?[...order.payments.slice(0,idx),newP,...order.payments.slice(idx)]:[...order.payments,newP];
    onUpdate({...order,payments});
  };
  const pSt=p=>{if(p.receivedDate)return['입금완료','b-green'];if(p.invoiceDate)return['발행완료','b-blue'];if(p.invoiceRequested)return['요청됨','b-yellow'];return['미발행','b-gray'];};
  const sSt=p=>{if(p.paidDate)return['지급완료','b-green'];if(p.invoiceDate)return['계산서수취','b-blue'];return['미수취','b-gray'];};
  const iS={background:'#fff',border:'1px solid #e2e8f0',borderRadius:5,padding:'4px 7px',color:'#1e293b',fontSize:11,fontFamily:'inherit',outline:'none'};
  // 보증보험 (계약이행/선급금/하자이행) 해당·발행 체크 — 결제구조와 무관
  const BOND_TYPES=[['perf','계약이행'],['advance','선급금'],['defect','하자이행']];
  const bondVal=(bonds,k)=>(bonds&&bonds[k])||{};
  const setOrderBond=(k,f,v)=>onUpdate({...order,bonds:{...order.bonds,[k]:{...bondVal(order.bonds,k),[f]:v}}});
  const setSubBond=(sid,k,f,v)=>{const s=order.subcontractors.map(su=>su.id!==sid?su:{...su,bonds:{...su.bonds,[k]:{...bondVal(su.bonds,k),[f]:v}}});onUpdate({...order,subcontractors:s});};
  // 컴팩트 한 줄: 보증보험  ☐계약이행  ☐선급금  ☐하자이행 → 해당 체크 시 발행·발행일 노출
  const bondStrip=(bonds,onBond,label)=>E('div',{style:{display:'flex',flexWrap:'wrap',alignItems:'center',gap:16,fontSize:11,padding:'7px 2px 3px',borderTop:'1px dashed #e2e8f0',marginTop:3}},
    E('span',{style:{fontWeight:700,color:label?'#f97316':'#64748b'}},label||'보증보험'),
    ...BOND_TYPES.map(([k,lbl])=>{const b=bondVal(bonds,k);const req=!!b.required;return E('span',{key:k,style:{display:'inline-flex',alignItems:'center',gap:5}},
      E('label',{style:{display:'inline-flex',alignItems:'center',gap:3,cursor:'pointer'}},
        E('input',{type:'checkbox',checked:req,onChange:e=>onBond(k,'required',e.target.checked),style:{width:14,height:14,cursor:'pointer'}}),
        E('span',{style:{fontWeight:req?600:400,color:req?'#1e40af':'#94a3b8'}},lbl)),
      req&&E('label',{style:{display:'inline-flex',alignItems:'center',gap:3,cursor:'pointer',color:'#64748b'}},
        E('input',{type:'checkbox',checked:!!b.issued,onChange:e=>onBond(k,'issued',e.target.checked),style:{width:14,height:14,cursor:'pointer'}}),
        E('span',null,'발행')),
      req&&b.issued&&E('input',{type:'date',value:b.issuedDate||'',onChange:e=>onBond(k,'issuedDate',e.target.value||null),style:{...iS,width:118,padding:'2px 5px'}})
    );})
  );
  return E('div',{className:'exp-area'},
    E('div',{style:{fontSize:11,color:'#64748b',marginBottom:10}},'💡 세금계산서 발행일 입력 시 현금흐름 탭에 자동 반영됩니다'),
    order.payments.length>0&&E('div',{style:{marginBottom:8}},
      E('div',{className:'sec-lbl'},'수금 현황 (발주처)'),
      E('table',null,
        E('thead',null,E('tr',null,...['구분','결제조건','금액','비율','예상수금일','세금계산서 발행일','입금일','상태',''].map(h=>E('th',{key:h,style:['금액'].includes(h)?{textAlign:'right'}:['비율'].includes(h)?{textAlign:'center',color:'#94a3b8'}:h==='결제조건'?{color:'#94a3b8',maxWidth:120}:h==='예상수금일'?{color:'#0d9488'}:{}},h)))),
        E('tbody',null,...order.payments.map((p,i)=>{const[sl,sc]=pSt(p);return E('tr',{key:p.id},
          E('td',{style:{fontWeight:500,color:'#1e40af'}},p.type),
          E('td',{style:{fontSize:11,color:'#64748b',maxWidth:140,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},p.condition||'—'),
          E('td',{className:'mono',style:{textAlign:'right'}},fmt(p.amount)),
          E('td',{style:{textAlign:'center',fontSize:11,color:'#64748b'}},
            order.projectAmount>0&&p.amount>0
              ?(Math.round(p.amount/order.projectAmount*1000)/10).toFixed(1)+'%'
              :'—'
          ),
          E('td',null,E('input',{type:'date',value:p.expectedDate||'',onChange:e=>setP(i,'expectedDate',e.target.value||null),title:'예상 수금일 (자금예측에 반영)',style:{...iS,width:130,borderColor:'#5eead4'}})),
          E('td',null,E('input',{type:'date',value:p.invoiceDate||'',onChange:e=>setP(i,'invoiceDate',e.target.value||null),style:{...iS,width:130}})),

// ── YearSelect ────────────────────────────────────────────
function YearSelect({orders,onSelect}){
  const E=React.createElement;
  const years=[...new Set(orders.map(o=>o.startDate?.slice(0,4)||'미정'))].sort((a,b)=>b.localeCompare(a));
  if(years.length===0)years.push(String(new Date().getFullYear()));
  return E('div',null,
    E('div',{style:{fontSize:14,fontWeight:700,marginBottom:16}},'수주현황 — 연도 선택'),
    E('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12}},
      ...years.map(yr=>{
        const yrOrders=orders.filter(o=>(o.startDate?.slice(0,4)||'미정')===yr);
        const cnt=yrOrders.length;
        const totKRW=yrOrders.filter(o=>o.currency!=='USD').reduce((s,o)=>s+(o.projectAmount||0),0);
        const totUSD=yrOrders.filter(o=>o.currency==='USD').reduce((s,o)=>s+(o.projectAmount||0),0);
        return E('div',{key:yr,onClick:()=>onSelect(yr),style:{background:'#fff',border:'1px solid #e2e8f0',borderRadius:10,padding:'20px 16px',cursor:'pointer',textAlign:'center',transition:'box-shadow .15s'},
          onMouseEnter:e=>{e.currentTarget.style.boxShadow='0 4px 12px rgba(30,64,175,.15)';e.currentTarget.style.borderColor='#1e40af';},
          onMouseLeave:e=>{e.currentTarget.style.boxShadow='';e.currentTarget.style.borderColor='#e2e8f0';}},
          E('div',{style:{fontSize:28,fontWeight:700,color:'#1e40af',marginBottom:6}},yr+'년'),
          E('div',{style:{fontSize:13,color:'#64748b',marginBottom:4}},cnt+'건'),
          E('div',{style:{fontSize:12,color:'#94a3b8',marginBottom:totUSD>0?2:0}},totKRW?abbr(totKRW)+'원':'-'),
          totUSD>0&&E('div',{style:{fontSize:12,color:'#059669',fontWeight:600}},'$'+Number(totUSD).toLocaleString('en-US'))
        );
      })
    )
  );
}

function OrderList({orders,saveOrders,managers,clients}){
  const E=React.createElement;

  const[status,setStatus]=useState('all');
  const[srch,setSrch]=useState('');
  const[modal,setModal]=useState(null);
  const[delTarget,setDelTarget]=useState(null);
  const[sortKey,setSortKey]=useState('no');
  const[sortDir,setSortDir]=useState('asc');
  const toggle=id=>setExp(e=>({...e,[id]:!e[id]}));
  const getSt=o=>{const b=oBalance(o);if(!o.projectAmount)return['금액미정','b-gray'];if(b<=0)return['완료','b-green'];if(o.payments.some(p=>p.receivedDate))return['진행중','b-blue'];return['미수','b-amber'];};
  const handleSort=key=>{if(sortKey===key){setSortDir(d=>d==='asc'?'desc':'asc');}else{setSortKey(key);setSortDir('asc');}};
  const sortIcon=key=>{if(sortKey!==key)return' ↕';return sortDir==='asc'?' ↑':' ↓';};
  const thStyle=(key,extra={})=>({cursor:'pointer',userSelect:'none',whiteSpace:'nowrap',...extra});

  // 연도 선택 전
  if(!year) return E(Fragment,null,
    E(YearSelect,{orders,onSelect:yr=>{setYear(yr);setExp({});setSrch('');setMgr('all');setStatus('all');}})
  );

// ── ClientList ───────────────────────────────────────────
function ClientList({clients,saveClients,orders,saveOrders}){
  const E=React.createElement;
  const[modal,setModal]=useState(null);
  const[srch,setSrch]=useState("");
  const filtered=(clients||[]).filter(c=>c.name.includes(srch)||c.code.includes(srch)||(c.phone||"").includes(srch));
  const del=id=>{if(window.confirm("삭제하시겠습니까?"))saveClients(clients.filter(c=>c.id!==id));};
  const save=cl=>{
    const existing=clients.find(x=>x.id===cl.id);
    if(existing){
      // 이름이 바뀐 경우 수주현황 거래처명도 일괄 업데이트
      if(existing.name!==cl.name&&orders&&saveOrders){
        const updatedOrders=orders.map(o=>o.clientName===existing.name?{...o,clientName:cl.name}:o);
        saveOrders(updatedOrders);
      }
      saveClients(clients.map(x=>x.id===cl.id?cl:x));
    } else {
      saveClients([...clients,{...cl,id:uid()}]);
    }
    setModal(null);
  };
  return E(Fragment,null,
    modal&&E(ClientModal,{client:modal==="new"?null:modal,onSave:save,onClose:()=>setModal(null)}),
    E("div",null,
      E("div",{className:"toolbar"},
        E("div",{style:{display:"flex",gap:8,alignItems:"center"}},
          E("input",{className:"inp",placeholder:"거래처명 / 번호 검색",value:srch,onChange:e=>setSrch(e.target.value),style:{width:200}}),
          E("span",{style:{fontSize:11,color:"#64748b"}},filtered.length+"건")
        ),
        E("div",{style:{display:"flex",gap:8}},
          E("button",{className:"btn",style:{whiteSpace:"nowrap"},onClick:()=>{
            if(!orders||!saveOrders){alert("수주 데이터 로딩 중입니다. 잠시 후 다시 시도해주세요.");return;}
            let updateCount=0;
            const updatedOrders=orders.map(o=>{
              const exact=clients.find(cl=>cl.name===o.clientName);
              if(exact)return o;
              const orderCode=(o.orderNo||"").slice(2,4);
              const matched=clients.find(cl=>cl.code===orderCode);
              if(matched&&matched.name!==o.clientName){updateCount++;return{...o,clientName:matched.name};}
              return o;
            });
            if(updateCount===0){alert("동기화할 항목이 없습니다. 모든 거래처명이 일치합니다.");}
            else{saveOrders(updatedOrders);alert(updateCount+"건의 거래처명이 동기화되었습니다.");}
          }},"🔄 수주 동기화"),
          E("button",{className:"btn pri",onClick:()=>setModal("new")},"+ 거래처 추가")
        )
      ),
      E("div",{className:"card"},
        E("div",{style:{overflowX:"auto"}},
          E("table",null,
            E("thead",null,E("tr",null,
              ...["번호","상호명","대표자","전화번호","이메일","주소","내부담당",""].map((h,i)=>E("th",{key:i},h))
            )),
            E("tbody",null,...filtered.map(cl=>E("tr",{key:cl.id},
              E("td",{style:{fontWeight:700,color:"#1e40af",width:50}},cl.code),
              E("td",{style:{fontWeight:500}},cl.name),
              E("td",{style:{color:"#64748b"}},cl.ceo||"—"),
              E("td",{style:{color:"#64748b"}},cl.phone||"—"),

              E("td",{style:{color:"#64748b",fontSize:11}},cl.note||"—"),

                  E("button",{className:"btn sm",onClick:()=>setModal(cl)},"수정"),

                )
              )
            )))
          )
        )
      )

// ── CashFlow ─────────────────────────────────────────────
function CashFlow({orders,cfData,saveCf,cfPassword,savePw,onLock}){
  const E=React.createElement;
  const months=Array.from({length:12},(_,i)=>'2026-'+String(i+1).padStart(2,'0'));
  const[sel,setSel]=useState(thisM);
  const prevYm=(()=>{const d=new Date(sel+'-01');d.setMonth(d.getMonth()-1);return d.toISOString().slice(0,7);})();

  const curInc=[];
  orders.forEach(o=>o.payments.forEach(p=>{
    if(p.invoiceDate&&ym(p.invoiceDate)<sel&&!p.receivedDate)
      curInc.push({name:o.clientName,desc:o.description,date:p.invoiceDate,amount:p.amount,type:p.type,currency:o.currency||'KRW'});
  }));
  curInc.sort((a,b)=>a.date.localeCompare(b.date));

  const nxtInc=[];
  orders.forEach(o=>o.payments.forEach(p=>{
    if(p.invoiceDate&&ym(p.invoiceDate)===sel&&!p.receivedDate)
      nxtInc.push({name:o.clientName,desc:o.description,date:p.invoiceDate,amount:p.amount,type:p.type,currency:o.currency||'KRW'});
  }));
  nxtInc.sort((a,b)=>a.date.localeCompare(b.date));

  const totCur=curInc.reduce((s,x)=>s+x.amount,0);
  const totNxt=nxtInc.reduce((s,x)=>s+x.amount,0);

  const unpaidInv=[];
  orders.forEach(o=>o.payments.forEach(p=>{
    if(!p.invoiceDate&&(p.amount||0)>0)
      unpaidInv.push({orderNo:o.orderNo,clientName:o.clientName,desc:o.description,type:p.type,amount:p.amount,currency:o.currency||'KRW',endDate:o.endDate,manager:o.manager});
  }));
  unpaidInv.sort((a,b)=>(a.endDate||'9999').localeCompare(b.endDate||'9999'));

// ── CashForecast ─────────────────────────────────────────
function CashForecast({orders}){
  const E=React.createElement;
  const [openM,setOpenM]=useState(null);
  const events=[];
  (orders||[]).forEach(o=>{
    if(o.currency==='USD') return;
    (o.payments||[]).forEach(p=>{ if(p.expectedDate&&!p.receivedDate&&(p.amount||0)>0) events.push({date:p.expectedDate,kind:'in',amount:p.amount||0,name:o.clientName,type:p.type,orderNo:o.orderNo}); });
    (o.subcontractors||[]).forEach(sub=>{ (sub.payments||[]).forEach(p=>{ if(p.expectedPayDate&&!p.paidDate&&(p.amount||0)>0) events.push({date:p.expectedPayDate,kind:'out',amount:p.amount||0,name:sub.name,type:p.type,orderNo:o.orderNo}); }); });
  });
  events.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const mMap={};
  events.forEach(e=>{const k=e.date.slice(0,7);if(!mMap[k])mMap[k]={ym:k,events:[]};mMap[k].events.push(e);});
  const months=Object.values(mMap).sort((a,b)=>a.ym<b.ym?-1:1);
  return E('div',null,
    E('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:14,flexWrap:'wrap'}},
      E('div',{style:{fontSize:16,fontWeight:700}},'자금 예측'),
      E('span',{style:{fontSize:12,color:'#64748b'}},'프로젝트별 예상 수금 · 협력업체 예상 지출 일정')
    ),
    events.length===0
      ? E('div',{className:'card',style:{textAlign:'center',padding:'40px 20px',color:'#64748b',fontSize:13}},
          E('div',{style:{marginBottom:8,fontSize:14,fontWeight:600,color:'#1e293b'}},'아직 예상일이 입력되지 않았습니다'),
          '수주현황에서 수주를 펼쳐 결제항목의 ',E('b',null,'예상수금일'),'을 입력하면 여기에 일정이 표시됩니다. 협력업체는 ',E('b',null,'예상지출일'),'(익월말 버튼)을 입력하세요.')
      : E('div',{className:'card'},
          E('div',{className:'card-hdr'},E('span',null,'예상 수금·지출 일정'),E('span',{style:{fontSize:11,color:'#94a3b8',fontWeight:400,marginLeft:6}},'(월을 클릭하면 펼쳐집니다)')),
          E('div',{style:{overflowX:'auto'}},
            E('table',null,
              E('thead',null,E('tr',null,
                E('th',{style:{width:24}}),
                E('th',null,'월'),
                E('th',{style:{textAlign:'right'}},'건수')
              )),
              E('tbody',null,...months.map(m=>{
                const open=openM===m.ym;
                const inCnt=m.events.filter(e=>e.kind==='in').length, outCnt=m.events.length-inCnt;
                return E(Fragment,{key:m.ym},
                  E('tr',{style:{cursor:'pointer'},onClick:()=>setOpenM(open?null:m.ym)},
                    E('td',{style:{textAlign:'center',color:'#94a3b8',fontSize:11}},open?'▼':'▶'),
                    E('td',{style:{fontWeight:600}},m.ym),
                    E('td',{style:{textAlign:'right',fontSize:11,color:'#64748b'}},'수금 '+inCnt+' · 지급 '+outCnt)
                  ),
                  open&&E('tr',{key:m.ym+'_e'},
                    E('td',{colSpan:3,style:{padding:0,background:'#f8fafc'}},
                      E('div',{style:{padding:'8px 12px'}},
                        E('table',null,
                          E('thead',null,E('tr',null,...['날짜','수주번호','대상','수금/지급','구분','금액'].map((h,i)=>E('th',{key:i,style:['금액'].includes(h)?{textAlign:'right'}:{}},h)))),
                          E('tbody',null,...m.events.map((e,i)=>E('tr',{key:i},
                            E('td',{style:{fontSize:11,color:'#64748b',whiteSpace:'nowrap'}},e.date),
                            E('td',{className:'mono',style:{fontSize:11,color:'#1e40af'}},e.orderNo),
                            E('td',{style:{fontWeight:500}},e.name),
                            E('td',null,E('span',{className:'badge '+(e.kind==='in'?'b-green':'b-red')},e.kind==='in'?'수금':'지급')),
                            E('td',{style:{fontSize:11,color:'#64748b'}},e.type),
                            E('td',{className:'mono',style:{textAlign:'right',color:e.kind==='in'?'#059669':'#dc2626'}},(e.kind==='in'?'+':'-')+fmt(e.amount))
                          ))
                        )
                      )
                    )
                  )
                ));
              }))
            )
          )
        )
  );
}

// ── ContractList (계약서 히스토리) ───────────────────────
function ContractList({contracts,orders,vendors,clients,saveContracts,saveVendors,saveClients}){
  const E=React.createElement;
  const [editing,setEditing]=useState(null);
  const [showVendors,setShowVendors]=useState(false);
  const [srch,setSrch]=useState("");
  const list=(contracts||[]).filter(c=>!srch||[(c.supplier&&c.supplier.name),(c.orderer&&c.orderer.name),c.title,c.contractNo].some(v=>(v||"").includes(srch))).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.contractNo||"").localeCompare(a.contractNo||""));
  const saveOne=rec=>{const ex=(contracts||[]).find(x=>x.id===rec.id);if(ex)saveContracts(contracts.map(x=>x.id===rec.id?rec:x));else saveContracts([...(contracts||[]),rec]);
    // 계약서 저장 시 상대방을 명부에 자동 등록 (이름 기준 중복 방지)
    if(rec.type==="vendor"){const s=rec.supplier||{},nm=(s.name||"").trim();if(nm&&!(vendors||[]).some(v=>(v.name||"").trim()===nm))saveVendors([...(vendors||[]),{id:uid(),name:nm,bizNo:s.bizNo||"",ceo:s.ceo||"",address:s.address||""}]);}
    else if(rec.type==="client"){const o=rec.orderer||{},nm=(o.name||"").trim();if(nm&&saveClients&&!(clients||[]).some(c=>(c.name||"").trim()===nm))saveClients([...(clients||[]),{id:uid(),name:nm,bizNo:o.bizNo||"",ceo:o.ceo||"",address:o.address||""}]);}};
  const del=id=>{if(window.confirm("이 계약서를 삭제하시겠습니까?"))saveContracts((contracts||[]).filter(x=>x.id!==id));};
  const dup=rec=>setEditing({...rec,id:"",contractNo:"",date:today,status:"작성중"});
  const toggleStatus=c=>saveContracts((contracts||[]).map(x=>x.id===c.id?{...x,status:(x.status==="완료"?"작성중":"완료")}:x));
  const other=c=>c.type==="vendor"?(c.supplier&&c.supplier.name):(c.orderer&&c.orderer.name);
  if(editing)return E(ContractEditor,{contract:editing,contracts,orders,vendors,clients,onSave:saveOne,onClose:()=>setEditing(null)});
  return E(Fragment,null,
    showVendors&&E(VendorModal,{vendors,onSave:v=>{saveVendors(v);setShowVendors(false);},onClose:()=>setShowVendors(false)}),
    E("div",null,
      E("div",{className:"toolbar"},
        E("div",{style:{display:"flex",gap:8,alignItems:"center"}},
          E("input",{className:"inp",placeholder:"문서번호/거래처/품명 검색",value:srch,onChange:e=>setSrch(e.target.value),style:{width:220}}),
          E("span",{style:{fontSize:11,color:"#64748b"}},list.length+"건")),
        E("div",{style:{display:"flex",gap:8}},
          E("button",{className:"btn",onClick:()=>setShowVendors(true)},"협력업체 명부"),
          E("button",{className:"btn",onClick:()=>setEditing({type:"client"})},"+ 고객사 계약서"),
          E("button",{className:"btn pri",onClick:()=>setEditing({type:"vendor"})},"+ 협력업체 계약서"))),
      E("div",{className:"card"},
        E("div",{style:{overflowX:"auto"}},
          E("table",null,
            E("thead",null,E("tr",null,...["문서번호","종류","수주번호","상대방","품명","계약금액","작성일","상태",""].map((h,i)=>E("th",{key:i,style:h==="계약금액"?{textAlign:"right"}:{}},h)))),
            E("tbody",null, list.length===0
              ? E("tr",null,E("td",{colSpan:9,style:{textAlign:"center",padding:"30px",color:"#94a3b8"}},"작성된 계약서가 없습니다. 우측 상단에서 새 계약서를 만드세요."))
              : list.map(c=>E("tr",{key:c.id},
                E("td",{className:"mono",style:{fontSize:11,fontWeight:600,color:"#1e40af"}},c.contractNo),
                E("td",null,E("span",{className:"badge "+(c.type==="vendor"?"b-amber":"b-blue")},c.type==="vendor"?"협력업체":"고객사")),
                E("td",{className:"mono",style:{fontSize:11}},c.orderNo||"—"),
                E("td",{style:{fontWeight:500}},other(c)||"—"),
                E("td",{style:{color:"#64748b",maxWidth:200,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},c.title||"—"),
                E("td",{className:"mono",style:{textAlign:"right"}},fmt(c.amount)+"원"),
                E("td",{style:{fontSize:11,color:"#64748b"}},c.date),
                E("td",null,E("span",{className:"badge "+(c.status==="완료"?"b-green":"b-gray"),onClick:()=>toggleStatus(c),title:"클릭하여 상태 변경 (작성중 ↔ 완료)",style:{cursor:"pointer",userSelect:"none"}},c.status||"작성중")),
                E("td",{style:{padding:"4px 6px"}},E("div",{style:{display:"flex",gap:4}},
                  E("button",{className:"btn sm",onClick:()=>setEditing(c)},"열기"),
                  E("button",{className:"btn sm",onClick:()=>dup(c)},"복제"),
                  E("button",{className:"btn sm dng",onClick:()=>del(c.id)},"삭제")))
              )))
          )
        )
      )
    )
  );
}

// ── App ──────────────────────────────────────────────────
function App(){
  const E=React.createElement;
  const[tab,setTab]=useState("dashboard");
  const[orders,setOrders]=useState(null);
  const[clients,setClients]=useState(null);
  const[cfData,setCfData]=useState({});
  const[managers,setManagers]=useState(null);
  const[cfUnlocked,setCfUnlocked]=useState(false);
  const[showPwModal,setShowPwModal]=useState(false);
  const[showMgrModal,setShowMgrModal]=useState(false);
  const[cfPassword,setCfPassword]=useState("1234");
  const[vendors,setVendors]=useState([]);
  const[contracts,setContracts]=useState([]);

  useEffect(()=>{
    if(!FB_OK){
      Promise.all([dbGet("orders"),dbGet("clients"),dbGet("cashflow"),dbGet("settings")]).then(([o,cl,cf,st])=>{
        setOrders(o||INIT);
        setClients(cl||INIT_CLIENTS);
        setCfData(cf||{});
        if(st&&st.cfPassword)setCfPassword(st.cfPassword);
        if(st&&st.managers)setManagers(st.managers); else setManagers(INIT_MANAGERS);
      });
      return;
    }
    const u1=dbListen("orders",o=>setOrders(o));
    const u2=dbListen("clients",cl=>setClients(cl));
    const u3=dbListen("cashflow",cf=>setCfData(cf));
    const u4=dbListen("settings",st=>{
      if(st&&st.cfPassword)setCfPassword(st.cfPassword);
      if(st&&st.managers)setManagers(st.managers);
    });
    const u5=dbListen("vendors",v=>setVendors(v||[]));
    const u6=dbListen("contracts",cs=>setContracts(cs||[]));
    Promise.all([dbGet("orders"),dbGet("clients"),dbGet("cashflow"),dbGet("settings"),dbGet("vendors"),dbGet("contracts")]).then(([o,cl,cf,st,vn,ct])=>{
      if(!o)dbSet("orders",INIT).then(()=>setOrders(INIT)); else setOrders(o);
      if(!cl)dbSet("clients",INIT_CLIENTS).then(()=>setClients(INIT_CLIENTS)); else setClients(cl);
      setCfData(cf||{});
      setVendors(vn||[]);
      setContracts(ct||[]);
      const pw=(st&&st.cfPassword)||"1234";
      const mgrs=(st&&st.managers)||INIT_MANAGERS;
      setCfPassword(pw);
      setManagers(mgrs);
      if(!st)dbSet("settings",{cfPassword:pw,managers:mgrs});
    });
    return()=>{if(u1)u1();if(u2)u2();if(u3)u3();if(u4)u4();if(u5)u5();if(u6)u6();};
  },[]);

  const saveO=o=>{setOrders(o);dbSet("orders",o);};
  const saveCl=cl=>{setClients(cl);dbSet("clients",cl);};
  const saveCf=cf=>{setCfData(cf);dbSet("cashflow",cf);};
  const savePw=pw=>{setCfPassword(pw);dbSet("settings",{cfPassword:pw,managers:managers||INIT_MANAGERS});};
  const saveMgrs=mgrs=>{setManagers(mgrs);dbSet("settings",{cfPassword,managers:mgrs});setShowMgrModal(false);};
  const saveVendors=v=>{setVendors(v);dbSet("vendors",v);};
  const saveContracts=cs=>{setContracts(cs);dbSet("contracts",cs);};

  const handleTab=id=>{
    if(id==="cashflow"&&!cfUnlocked){setShowPwModal(true);return;}
    setTab(id);
  };

  const mgrs=managers||INIT_MANAGERS;

  if(!FB_OK)return E(SetupScreen,null);
  if(!orders||!clients||!managers)return E("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:"#64748b"}},"로딩 중...");

  const tabs=[
    {id:"dashboard",label:"대시보드"},
    {id:"clients",label:"거래처 관리"},
    {id:"orders",label:"수주현황"},
    {id:"contracts",label:"계약서"},
    {id:"forecast",label:"자금예측"},
    {id:"cashflow",label:"현금흐름"},
  ];

  return E("div",null,
    showPwModal&&E(PasswordModal,{password:cfPassword,onSuccess:()=>{setCfUnlocked(true);setShowPwModal(false);setTab("cashflow");},onClose:()=>setShowPwModal(false)}),
    showMgrModal&&E(ManagerModal,{managers:mgrs,onSave:saveMgrs,onClose:()=>setShowMgrModal(false)}),
    E("div",{className:"hdr"},
      E("div",{className:"hdr-inner"},
        E("div",{className:"logo"},E("img",{src:"logo.png",alt:"KMJE"}),"케이엠제이 수주관리"),
        ...tabs.map(t=>E("button",{key:t.id,onClick:()=>handleTab(t.id),className:"tab"+(tab===t.id?" on":"")},t.label)),
        E("button",{className:"btn sm",onClick:()=>setShowMgrModal(true),style:{marginLeft:"auto",marginRight:8}},"담당자 관리"),
        E("span",{className:"sync-badge "+(FB_OK?"sync-live":"sync-local")},FB_OK?"실시간 공유":"로컬 모드")
      )
    ),
    E("div",{className:"main"},
      tab==="dashboard"&&E(Dashboard,{orders,saveOrders:saveO}),
      tab==="clients"&&E(ClientList,{clients,saveClients:saveCl,orders,saveOrders:saveO}),
      tab==="orders"&&E(OrderList,{orders,saveOrders:saveO,managers:mgrs,clients}),
      tab==="contracts"&&E(ContractList,{contracts,orders,vendors,clients,saveContracts,saveVendors,saveClients:saveCl}),
      tab==="forecast"&&E(CashForecast,{orders}),
      tab==="cashflow"&&E(CashFlow,{orders,cfData,saveCf,cfPassword,savePw,onLock:()=>{setCfUnlocked(false);setTab("dashboard");}})
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
