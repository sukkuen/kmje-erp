// 연차 데이터는 같은 kmje 컬렉션에 별도 키(leave_*)로 저장 → 수주관리와 안 섞임
async function dbGet(k){
  if(db){ try{ const d=await db.collection('kmje').doc(k).get(); return d.exists?JSON.parse(d.data().v):null; }catch{ return null; } }
  try{ const v=localStorage.getItem('kmje_'+k); return v?JSON.parse(v):null; }catch{ return null; }
}
async function dbSet(k,val){
  if(db){ try{ await db.collection('kmje').doc(k).set({v:JSON.stringify(val)}); }catch(e){ console.error(e); } }
  else { localStorage.setItem('kmje_'+k, JSON.stringify(val)); }
}
function dbListen(k,cb){
  if(db) return db.collection('kmje').doc(k).onSnapshot(d=>{ if(d.exists) cb(JSON.parse(d.data().v)); });
  return null;
}

const {useState,useEffect} = React;
const E = React.createElement;
const uid = () => Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const today = () => new Date().toISOString().slice(0,10);
const HPD = 8; // 1일 = 8시간
const ADMIN_PW = "1234";   // 관리자 비밀번호 (배포 전 변경 권장)

const NOTES = [

// ── 연차 계산 (누적·이월 방식) ──
function monthsBetween(a,b){ let m=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth()); if(b.getDate()<a.getDate()) m--; return m; }
function grantAt(y){ return Math.min(25,15+Math.floor((y-1)/2)); } // 만근속 y년차(y>=1) 부여: 15→15→16…최대25
// 자동 보유연차: 입사 이후 누적 부여 (1년 미만은 월차 누적 최대11, 1주년 도달 시 11개 소멸 후 15부터 매년 누적)
function autoHold(hire){
  const h=new Date(hire), now=new Date();
  const months=monthsBetween(h,now), y=Math.floor(months/12);
  if(y<1) return Math.min(11,Math.max(0,months));
  let sum=0; for(let k=1;k<=y;k++) sum+=grantAt(k);
  return sum;
}
function calcEntitle(hire){
  const h=new Date(hire), now=new Date();
  const months=monthsBetween(h,now), years=Math.floor(months/12);
  return {years, months};
}
function balance(emp, leaves){
  const ent=calcEntitle(emp.hire);
  // 보유연차: 관리자 직접수정(holdOverride)이 있으면 그 값, 없으면 자동 누적
  const auto=autoHold(emp.hire);
  const hasOverride = emp.holdOverride!==undefined && emp.holdOverride!==null && emp.holdOverride!=='';
  const total = hasOverride ? Number(emp.holdOverride) : auto;
  // 누적 사용: 입사 이후 전체 승인분 합 (날짜형 + 일수형 모두, 연도 무관)
  const used = Math.round(leaves.filter(l=>l.emp===emp.id&&l.status==='approved').reduce((s,l)=>s+l.days,0)*10)/10;
  // 중간정산(돈으로 정산/퇴사정리 차감)
  const settle = Number(emp.settle)||0;
  const remain = Math.round((total-used-settle)*10)/10;
  const pending = Math.round(leaves.filter(l=>l.emp===emp.id&&l.status==='pending').reduce((s,l)=>s+l.days,0)*10)/10;
  return {total, auto, hasOverride, used, settle, remain, pending, years:ent.years, months:ent.months};
}
const yLabel = b => b.months<12 ? b.months+'개월' : b.years+'년';
// 직원 정렬: 임원 먼저 → 부서 가나다순 → 부서 안에서 직위 순 → 이름 가나다순
const DEPT_FIRST=['임원'];
const POS_RANK=['대표','대표이사','부사장','전무','상무','이사','부장','차장','과장','대리','주임','사원'];
function sortEmps(list){
  const posR=p=>{const i=POS_RANK.indexOf(p);return i===-1?99:i;};
  return [...list].sort((a,b)=>{
    const da=a.dept||'-', db=b.dept||'-';
    const fa=DEPT_FIRST.indexOf(da), fb=DEPT_FIRST.indexOf(db);
    if(fa!==fb){ if(fa===-1) return 1; if(fb===-1) return -1; return fa-fb; }
    if(da!==db){ if(da==='-') return 1; if(db==='-') return -1; return da.localeCompare(db,'ko'); }
    const ra=posR(a.position), rb=posR(b.position);
    if(ra!==rb) return ra-rb;
    return (a.name||'').localeCompare(b.name||'','ko');
  });
}
// 일수(소수) → '26일 4h' 표기 (1일=8시간)
function fmtDays(d){
  if(d===null||d===undefined||isNaN(d)) return '-';
  const neg=d<0; let v=Math.abs(d);
  let days=Math.floor(v);
  let frac=Math.round((v-days)*HPD); // 정수 시간으로 반올림(소수점 제거)
  if(frac>=HPD){ days+=Math.floor(frac/HPD); frac=frac%HPD; }
  let s;
  if(frac===0) s=days+'일';
  else if(days===0) s=frac+'h';
  else s=days+'일 '+frac+'h';
  return (neg?'-':'')+s;
}
// 연차 종류 한글 표기
function typeLabel(l){
  if(l.daysOnly) return '일수입력';
  if(l.type==='hour') return '시간연차';
  if(l.type==='month') return '월차';
  return '연차';
}
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/86400000)+1;
// 'HH:MM'~'HH:MM' → 시간 수(정수, 시간 단위). 마치는 시각이 더 빠르면 0.
function hoursBetween(s,e){
  if(!s||!e) return 0;
  const [sh,sm]=s.split(':').map(Number), [eh,em]=e.split(':').map(Number);
  const mins=(eh*60+em)-(sh*60+sm);
  return mins>0?Math.round(mins/60*100)/100:0;
}
// 시각 선택용 정시 목록 (06:00 ~ 22:00, 분 단위 없음)
const HOUR_OPTS=(()=>{const a=[];for(let h=6;h<=22;h++)a.push((h<10?'0'+h:h)+':00');return a;})();

// ── 식비 지원 (2026-10 시행 기준안) ──
const MEAL_PRICE=9000; // 1식 지원금
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
// 하루 식비 판정 (규정 → 코드).
// emp: {isOffice,isDorm} / isHol: 토·일·공휴일 여부
// lv: {full:종일연차, hours:시간차 시간수}
// ent: {eo:조출시간, ot:잔업시간, wh:휴일근무시간, absent:결근,
//       bt:출장(기록·일수 집계용, 식비 영향 없음), sb:숙박(그날 석식+익일 조식),
//       cl:회사중식제공, cd:회사석식제공, rc:석식 영수증(사무실 잔업 석식 증빙)}
// prevStay: 전날 숙박(sb) 여부 → 오늘 조식 지급
function mealCalc(emp,isHol,lv,ent,prevStay){
  ent=ent||{}; lv=lv||{};
  // 사무실 직원의 잔업 석식은 영수증 증빙(rc) 시에만 지급 (기숙사 상시 석식·숙박 석식은 예외)
  const otDinnerOk=o=>o>0&&(!emp.isOffice||!!ent.rc);
  const mark=(ent.bt?'출':'')+(ent.sb?'박':'');              // 출장/숙박 표기
  if(isHol){
    const wh=Number(ent.wh)||0, ot=Number(ent.ot)||0;
    const bfast=!!prevStay;                                  // 숙박 다음날 조식 (휴일에도)
    if(wh<=0&&ot<=0&&!ent.sb&&!bfast&&!ent.bt)
      return {meals:0,code:'/'};                             // 휴일 미근무
    const lunch=(emp.isOffice?wh>0:wh>=5)&&!ent.cl;          // 중식: 사무실 출근만 해도 / 현장 5시간 이상
    const dinner=(otDinnerOk(ot)||ent.sb)&&!ent.cd;          // 석식: 휴일 잔업 시 + 숙박하는 날은 무조건
    const code=(wh>0||ot>0?'휴'+(wh||0)+(ot>0?'잔'+ot:''):'')+mark||'/';
    return {meals:(bfast?1:0)+(lunch?1:0)+(dinner?1:0),code};
  }
  if(ent.absent) return {meals:0,code:'결'};                  // 결근: 기숙사 석식비도 없음
  if(lv.full) return {meals:0,code:'연'};                     // 종일 연차: 기숙사 석식비도 없음
  const h=(lv.hours!=null)?Number(lv.hours):null;
  const eo=Number(ent.eo)||0, ot=Number(ent.ot)||0;
  const parts=[]; if(h!=null)parts.push('시'+h); if(eo>0)parts.push('조'+eo); if(ot>0)parts.push('잔'+ot);
  const code=(parts.length?parts.join(''):(mark?'':'○'))+mark;
  if(h!=null&&h>3) return {meals:0,code};                    // 3시간 초과 시간차·반차: 전 끼니 미지원
  const bfast=eo>=2||!!prevStay;                             // 조식: 조출 2시간 이상 또는 숙박 다음날 (중복 시 1회)
  const lunch=!ent.cl;                                       // 회사 중식 제공 시 미지급
  const dinner=(otDinnerOk(ot)||emp.isDorm||ent.sb)&&!ent.cd;// 석식: 잔업자(사무실은 영수증) + 기숙사 + 숙박하는 날
  const meals=(bfast?1:0)+(lunch?1:0)+(dinner?1:0);
  return {meals,code};
}
// SheetJS 지연 로드 (엑셀 내보내기)
let XLSX_P=null;
function loadXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(XLSX_P) return XLSX_P;
  XLSX_P=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=()=>res(window.XLSX);
    s.onerror=()=>rej(new Error('엑셀 모듈 로드 실패 (인터넷 연결 확인)'));
    document.head.appendChild(s);
  });
  return XLSX_P;
}
// 출근대장 인쇄: 가로(landscape)로 출력
function printLandscape(){
  const st=document.createElement('style'); st.id='pg-land';
  st.textContent='@page{size:A4 landscape;margin:8mm;}';
  document.head.appendChild(st);
  const clean=()=>{ const s=document.getElementById('pg-land'); s&&s.remove(); window.removeEventListener('afterprint',clean); };
  window.addEventListener('afterprint',clean);
  window.print();
}

// 초기 시드 (Firebase에 데이터 없을 때만 사용)
const SEED_EMP = [
  {id:"e1",name:"김영수",hire:"2018-03-02",dept:"설계팀",position:"부장"},
  {id:"e2",name:"이정민",hire:"2021-07-15",dept:"설계팀",position:"과장"},
  {id:"e3",name:"박서연",hire:"2023-01-09",dept:"관리팀",position:"대리"}
];

function App(){
  const [live,setLive]=useState(false);
  const [authed,setAuthed]=useState(false);
  const [pw,setPw]=useState("");
  const [pwErr,setPwErr]=useState("");
  const [tab,setTab]=useState("apply");
  const [emps,setEmps]=useState([]);
  const [leaves,setLeaves]=useState([]);
  const [loaded,setLoaded]=useState(false);

  // 데이터 로드 + 실시간 구독 (수주관리와 동일 패턴)
  useEffect(()=>{
    let unsubE,unsubL;
    (async()=>{
      let e=await dbGet('leave_employees');
      let l=await dbGet('leave_records');
      if(!e){ e=SEED_EMP; await dbSet('leave_employees',e); }
      if(!l){ l=[]; await dbSet('leave_records',l); }
      setEmps(sortEmps(e)); setLeaves(l); setLoaded(true);
      setLive(!!db);
      unsubE=dbListen('leave_employees',v=>setEmps(sortEmps(v||[])));
      unsubL=dbListen('leave_records',v=>setLeaves(v||[]));
    })();
    return ()=>{ unsubE&&unsubE(); unsubL&&unsubL(); };
  },[]);

  // 직원 명부는 항상 정렬된 순서(임원→부서 가나다→직위→이름)로 유지·저장 → 모든 화면이 같은 순서
  const saveEmps=async(next)=>{ const s=sortEmps(next); setEmps(s); await dbSet('leave_employees',s); };
  const saveLeaves=async(next)=>{ setLeaves(next); await dbSet('leave_records',next); };

  if(!loaded) return E('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',color:'#64748b'}},'데이터 불러오는 중...');

  // 공용 비밀번호 게이트
  if(!authed){
    return E('div',{className:'login-screen'},
      E('div',{className:'login-box'},
        E('div',{style:{fontSize:18,fontWeight:700,color:'#1e40af',marginBottom:6}},'㈜케이엠제이 연차관리'),
        E('div',{style:{fontSize:12,color:'#94a3b8',marginBottom:20}},'사내 공용 비밀번호를 입력하세요'),
        E('input',{type:'password',className:'inp',placeholder:'비밀번호',value:pw,style:{marginBottom:10},
          onChange:e=>setPw(e.target.value),onKeyDown:e=>{if(e.key==='Enter')doLogin();}}),
        E('button',{className:'btn pri',style:{width:'100%'},onClick:doLogin},'입장'),
        pwErr&&E('div',{style:{color:'#dc2626',fontSize:12,marginTop:10}},pwErr)
      ));
  }
  function doLogin(){ if(pw===SHARED_PW){ setAuthed(true); setPwErr(""); } else setPwErr("비밀번호가 올바르지 않습니다."); }

  return E(React.Fragment,null,
    E('div',{className:'hdr'},
      E('div',{className:'hdr-inner'},
        E('div',{className:'logo'},E('img',{src:'logo.png',alt:'KMJE',onError:e=>e.target.style.display='none'}),'케이엠제이 연차관리'),
        E('button',{className:'tab'+(tab==='apply'?' on':''),onClick:()=>setTab('apply')},'📅 연차 신청'),
        E('button',{className:'tab'+(tab==='dash'?' on':''),onClick:()=>setTab('dash')},'📊 대시보드'),
        E('button',{className:'tab'+(tab==='admin'?' on':''),onClick:()=>setTab('admin')},'🔒 관리자'),
        E('span',{className:'sync-badge '+(live?'sync-live':'sync-local')},live?'● 실시간 공유':'● 로컬 저장')
      )),
    E('div',{className:'main'},
      tab==='apply'&&E(ApplyTab,{emps,leaves,saveLeaves}),
      tab==='dash'&&E(DashTab,{emps,leaves}),
      tab==='admin'&&E(AdminTab,{emps,leaves,saveEmps,saveLeaves})
    )
  );
}

// ── 연차 신청 탭 ──
function ApplyTab({emps,leaves,saveLeaves}){
  const [empId,setEmpId]=useState("");
  const [type,setType]=useState("day");
  const [start,setStart]=useState("");
  const [end,setEnd]=useState("");
  const [stime,setStime]=useState("09:00");
  const [etime,setEtime]=useState("10:00");
  const [contact,setContact]=useState("");
  const [applyDate,setApplyDate]=useState("");
  const [handover,setHandover]=useState("");
  const [pendingWork,setPendingWork]=useState("");
  const [reason,setReason]=useState("");
  const [msg,setMsg]=useState(null);
  const [printRec,setPrintRec]=useState(null);

  const emp=emps.find(e=>e.id===empId);
  const bal=emp?balance(emp,leaves):null;

  async function submit(){
    if(!empId||!start){ setMsg({t:'이름과 시작일을 입력하세요.',c:'#dc2626'}); return; }
    let rec;
    if(type==='hour'){
      const hc=hoursBetween(stime,etime);
      if(hc<=0){ setMsg({t:'마치는 시각이 시작 시각보다 늦어야 합니다.',c:'#dc2626'}); return; }
      rec={lid:uid(),emp:empId,start,end:start,type:'hour',stime,etime,hours:hc,days:Math.round(hc/HPD*100)/100,reason:reason||'개인 사유',status:'pending'};
    } else {
      const ed=end||start;
      rec={lid:uid(),emp:empId,start,end:ed,type:type,days:daysBetween(start,ed),reason:reason||'개인 사유',status:'pending'};
    }
    await saveLeaves([...leaves,rec]);
    const nb=balance(emp,[...leaves,rec]);
    setMsg({t:'신청서 생성 완료 — 결재 대기 상태입니다. 프린트 후 결재를 받으세요. 승인 시 잔여 예상: '+fmtDays(bal.remain-rec.days),c:'#854d0e'});
    setPrintRec({rec,emp,contact,applyDate:applyDate||today(),handover,pendingWork,bal});
  }
  function doPrint(){ if(!printRec){ setMsg({t:'먼저 신청서를 생성하세요.',c:'#dc2626'}); return; } window.print(); }

  return E(React.Fragment,null,
    E('div',{className:'note-box no-print'},
      E('div',{style:{fontSize:12,fontWeight:700,color:'#1d4ed8',marginBottom:8}},'연차 승인 절차'),
      E('div',{className:'flow'},
        E('span',null,E('span',{className:'n'},'1'),'신청서 생성'),E('span',null,'→'),
        E('span',null,E('span',{className:'n'},'2'),'프린트'),E('span',null,'→'),
        E('span',null,E('span',{className:'n'},'3'),'종이 결재'),E('span',null,'→'),
        E('span',null,E('span',{className:'n'},'4'),'관리자 승인')),
      E('div',{style:{fontSize:11,color:'#3b6fd4',marginTop:8}},'위 4단계가 모두 끝나야 연차가 승인·차감됩니다. 신청서 생성·프린트만으로는 승인되지 않습니다.')
    ),
    E('div',{className:'card no-print'},
      E('div',{className:'card-hdr'},'연차 신청서 작성'),
      E('div',{className:'card-bd'},
        E('div',{className:'grid3',style:{marginBottom:12}},
          E('div',null,E('span',{className:'lbl'},'이름'),
            E('select',{className:'inp',value:empId,onChange:e=>setEmpId(e.target.value)},
              E('option',{value:''},'직원 선택'),
              emps.filter(e=>e.status!=='resigned').map(e=>E('option',{key:e.id,value:e.id},e.name)))),
          E('div',null,E('span',{className:'lbl'},'부서'),E('input',{className:'inp',value:emp?emp.dept:'',readOnly:true})),
          E('div',null,E('span',{className:'lbl'},'직위'),E('input',{className:'inp',value:emp?emp.position:'',readOnly:true}))
        ),
        bal&&E('div',{className:'kpis',style:{gridTemplateColumns:'repeat(4,1fr)',marginBottom:12}},
          E('div',{className:'kpi'},E('div',{className:'kpi-lbl'},'근속'),E('div',{className:'kpi-val',style:{fontSize:18}},yLabel(bal))),
          E('div',{className:'kpi'},E('div',{className:'kpi-lbl'},'보유 연차'),E('div',{className:'kpi-val',style:{fontSize:18}},fmtDays(bal.total))),
          E('div',{className:'kpi'},E('div',{className:'kpi-lbl'},'확정 잔여'),E('div',{className:'kpi-val',style:{fontSize:18,color:bal.remain<0?'#dc2626':'#1e40af'}},fmtDays(bal.remain))),
          E('div',{className:'kpi'},E('div',{className:'kpi-lbl'},'대기 중'),E('div',{className:'kpi-val',style:{fontSize:18,color:'#92400e'}},fmtDays(bal.pending)))
        ),
        E('div',{className:'grid2',style:{marginBottom:12}},
          E('div',null,E('span',{className:'lbl'},'연락처'),E('input',{className:'inp',value:contact,onChange:e=>setContact(e.target.value),placeholder:'010-0000-0000'})),
          E('div',null,E('span',{className:'lbl'},'작성일'),E('input',{type:'date',className:'inp',value:applyDate,onChange:e=>setApplyDate(e.target.value)}))
        ),
        E('div',{style:{display:'flex',gap:12,marginBottom:12,flexWrap:'wrap',alignItems:'flex-end'}},
          E('div',{style:{minWidth:120}},E('span',{className:'lbl'},'종류'),
            E('select',{className:'inp',value:type,onChange:e=>setType(e.target.value)},
              E('option',{value:'day'},'연차(일)'),E('option',{value:'month'},'월차(일)'),E('option',{value:'hour'},'시간(시간)'))),
          E('div',{style:{flex:1,minWidth:130}},E('span',{className:'lbl'},'시작일'),E('input',{type:'date',className:'inp',value:start,onChange:e=>setStart(e.target.value)})),
          type!=='hour'
            ? E('div',{style:{flex:1,minWidth:130}},E('span',{className:'lbl'},'종료일'),E('input',{type:'date',className:'inp',value:end,onChange:e=>setEnd(e.target.value)}))
            : E(React.Fragment,null,
                E('div',{style:{flex:1,minWidth:110}},E('span',{className:'lbl'},'시작 시각'),E('select',{className:'inp',value:stime,onChange:e=>setStime(e.target.value)},HOUR_OPTS.map(t=>E('option',{key:t,value:t},t)))),
                E('div',{style:{flex:1,minWidth:110}},E('span',{className:'lbl'},'마치는 시각'),E('select',{className:'inp',value:etime,onChange:e=>setEtime(e.target.value)},HOUR_OPTS.map(t=>E('option',{key:t,value:t},t)))),
                E('div',{style:{minWidth:80}},E('span',{className:'lbl'},'시간 수'),E('input',{className:'inp',readOnly:true,style:{background:'#f1f5f9',textAlign:'center'},value:hoursBetween(stime,etime)>0?hoursBetween(stime,etime)+'시간':'-'})))
        ),
        E('div',{className:'grid2',style:{marginBottom:12}},
          E('div',null,E('span',{className:'lbl'},'업무 인수자'),E('input',{className:'inp',value:handover,onChange:e=>setHandover(e.target.value)})),
          E('div',null,E('span',{className:'lbl'},'미결 업무'),E('input',{className:'inp',value:pendingWork,onChange:e=>setPendingWork(e.target.value)}))
        ),
        E('div',{style:{marginBottom:12}},E('span',{className:'lbl'},'사유'),E('input',{className:'inp',value:reason,onChange:e=>setReason(e.target.value),placeholder:'개인 사유'})),
        E('div',{style:{display:'flex',gap:10}},
          E('button',{className:'btn pri',style:{flex:1},onClick:submit},'📄 신청서 생성'),
          E('button',{className:'btn',style:{flex:1},onClick:doPrint},'🖨️ 프린트')),
        msg&&E('div',{style:{fontSize:12,marginTop:10,textAlign:'center',color:msg.c}},msg.t)
      )
    ),
    printRec&&E(PrintSheet,printRec)
  );
}

function DashTab({emps,leaves}){
  const [cur,setCur]=useState(()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1);});
  const shift=n=>setCur(new Date(cur.getFullYear(),cur.getMonth()+n,1));
  const y=cur.getFullYear(), m=cur.getMonth();
  const pad=n=>String(n).padStart(2,'0');
  const daysInMonth=new Date(y,m+1,0).getDate();
  const startWd=new Date(y,m,1).getDay();
  const now=new Date(), todayStr=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
  const appr=leaves.filter(l=>l.status==='approved'&&!l.daysOnly&&l.start);
  const colorOf=id=>{const i=emps.findIndex(e=>e.id===id);return CAL_PAL[(i<0?0:i)%CAL_PAL.length];};
  const monthCount=appr.filter(l=>{const s=l.start,e=l.end||l.start;const a=y+'-'+pad(m+1)+'-01',b=y+'-'+pad(m+1)+'-'+pad(daysInMonth);return s<=b&&e>=a;}).length;
  // 셀 구성 (앞 빈칸 + 날짜 + 뒤 빈칸)
  const cells=[];
  for(let i=0;i<startWd;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);
  function chipsFor(d){
    const ds=y+'-'+pad(m+1)+'-'+pad(d);
    return appr.filter(l=>{const s=l.start,e=l.end||l.start;return s<=ds&&ds<=e;}).map(l=>{
      const e=emps.find(x=>x.id===l.emp); if(!e) return null;
      const c=colorOf(l.emp);

}

  const [eName,setEName]=useState(""),[eHire,setEHire]=useState(""),[eDept,setEDept]=useState(""),[ePos,setEPos]=useState("");
  const [eHold,setEHold]=useState(""),[eSettle,setESettle]=useState("");
  const [eOffice,setEOffice]=useState(false),[eDorm,setEDorm]=useState(false);
  const [hmode,setHmode]=useState("period");
  // 기간형
  const [pEmp,setPEmp]=useState(""),[pStart,setPStart]=useState(""),[pEnd,setPEnd]=useState(""),[pDays,setPDays]=useState(""),[pReason,setPReason]=useState("");

  const [hmsg,setHmsg]=useState(null);

  async function addEmp(){
    if(!nName||!nHire){ alert('이름과 입사일을 입력하세요.'); return; }
    await saveEmps([...emps,{id:uid(),name:nName,hire:nHire,dept:nDept||'-',position:nPos||'-'}]);
    setNName("");setNHire("");setNDept("");setNPos("");
  }
  function startEdit(e){ setEditId(e.id);setEName(e.name);setEHire(e.hire);setEDept(e.dept);setEPos(e.position);setEHold(e.holdOverride!==undefined&&e.holdOverride!==null?String(e.holdOverride):"");setESettle(e.settle?String(e.settle):"");setEOffice(!!e.isOffice);setEDorm(!!e.isDorm); }
  async function saveEdit(){
    if(!eName||!eHire){ alert('이름과 입사일은 비울 수 없습니다.'); return; }
    const patch={name:eName,hire:eHire,dept:eDept||'-',position:ePos||'-'};
    patch.holdOverride = (eHold===''||eHold===null) ? null : Number(eHold);
    patch.settle = (eSettle===''||eSettle===null) ? 0 : Number(eSettle);
    patch.isOffice=eOffice; patch.isDorm=eDorm;
    await saveEmps(emps.map(x=>x.id===editId?{...x,...patch}:x));

  }
  async function delEmp(e){

    if(!confirm(e.name+' 직원을 완전히 삭제합니다.'+(cnt?' 연차 기록 '+cnt+'건도 함께 삭제됩니다.':'')+'\n※ 퇴사한 직원은 삭제 대신 [퇴사] 버튼을 사용하세요 (기록 보존).\n삭제는 오입력 정리 용도로만 사용하세요. 계속하시겠습니까?')) return;
    await saveEmps(emps.filter(x=>x.id!==e.id));
    await saveLeaves(leaves.filter(l=>l.emp!==e.id));

  // 퇴사 처리: 데이터는 보존하고 상태만 전환. 인사기록부(퇴사일·퇴사사유)와 자동 연동.
  async function retireEmp(e){
    const d=prompt(e.name+' 님의 퇴사일을 입력하세요 (YYYY-MM-DD)',today());
    if(d===null) return;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){ alert('날짜 형식이 올바르지 않습니다. 예: 2026-08-31'); return; }

const HR_KINDS=['징계','경고','포상','평가','사고·이슈','면담','퇴사사유','기타'];
const HR_KIND_BADGE={'징계':'b-red','경고':'b-amber','포상':'b-green','평가':'b-blue','사고·이슈':'b-amber','면담':'b-blue','퇴사사유':'b-gray','기타':'b-gray'};

// pdf.js 지연 로드 (엑셀 내보내기의 SheetJS와 같은 패턴)
let PDFJS_P=null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(PDFJS_P) return PDFJS_P;
  PDFJS_P=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; res(window.pdfjsLib); };
    s.onerror=()=>rej(new Error('pdf.js 로드 실패 (인터넷 연결 확인)'));
    document.head.appendChild(s);
  });
  return PDFJS_P;
}
// PDF → 줄 단위 텍스트 (y좌표로 줄 복원, 파일은 저장하지 않음)
async function pdfToLines(file){
  const lib=await loadPdfJs();
  const buf=await file.arrayBuffer();
  const doc=await lib.getDocument({data:buf}).promise;
  const lines=[];
  for(let p=1;p<=doc.numPages;p++){
    const page=await doc.getPage(p);
    const tc=await page.getTextContent();
    const rows={};
    tc.items.forEach(it=>{
      const y=Math.round(it.transform[5]);
      let key=null;
      for(const k in rows){ if(Math.abs(Number(k)-y)<=3){ key=k; break; } }
      if(key===null){ key=String(y); rows[key]=[]; }
      rows[key].push({x:it.transform[4],str:it.str});
    });
    Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>{
      const line=rows[String(y)].sort((a,b)=>a.x-b.x).map(i=>i.str).join(' ').replace(/\s+/g,' ').trim();
      if(line) lines.push(line);
    });
  }
  if(lines.length===0) throw new Error('글자를 찾지 못했습니다. 스캔 이미지 PDF는 지원하지 않습니다.');
  return lines;
}
function hrNormDate(s){
  const m=s&&s.match(/((?:19|20)\d{2})[.\-\/년\s]+(\d{1,2})[.\-\/월\s]+(\d{1,2})/);
  if(!m) return '';
  const pad=n=>String(n).padStart(2,'0');
  return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
}
// 표준 이력서 양식의 라벨 기반 파서. 같은 줄에 라벨이 여럿이어도 다음 라벨 전까지만 값으로 인식.
const HR_LABELS=['성명','성 명','이름','이 름','생년월일','성별','성 별','휴대폰','휴대전화','연락처','전화번호','이메일','E-mail','주소','비상연락처','학교명','최종학력','전공','졸업연도','졸업','경력','자격증명','자격증','자격사항','취득연도','특이사항','비자 종류','비자종류','비자','체류기간 만료일','체류기간','외국인등록번호','입사일','부서','직위'];
function hrParseResume(lines){
  const all=lines.join('\n');
  const cut=v=>{
    let idx=v.length;
    for(const t of HR_LABELS){ const i=v.indexOf(t); if(i===0) return ''; if(i>0&&i<idx) idx=i; }
    // pdf.js가 숫자 사이 하이픈에 공백을 넣는 경우 복원 (010 - 1234 → 010-1234)
    return v.slice(0,idx).replace(/(\d)\s*-\s*(\d)/g,'$1-$2').replace(/[\s:：|.\-]+$/,'').trim();
  };
  const after=lab=>{
    for(const ln of lines){
      const i=ln.indexOf(lab);
      if(i>=0){
        const v=cut(ln.slice(i+lab.length).replace(/^[\s:：|.]+/,''));
        if(v) return v;
      }
    }
    return '';
  };
  const firstOf=(...labs)=>{ for(const l of labs){ const v=after(l); if(v) return v; } return ''; };
  const out={};
  out.name=(firstOf('성명','성 명','이름','이 름').split(' ')[0])||'';
  const phoneSrc=firstOf('휴대폰','휴대전화','연락처','전화번호')||all;
  const pm=phoneSrc.match(/01[016789][\s.\-]{0,3}\d{3,4}[\s.\-]{0,3}\d{4}/);
  if(pm){ const d=pm[0].replace(/\D/g,''); out.phone=d.length===11?d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7):d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6); }
  const em=all.match(/[\w.+-]+@[\w-]+\.[\w.]+/); if(em) out.email=em[0];
  out.birth=hrNormDate(firstOf('생년월일'));
  const g=all.match(/성\s*별[^남여]{0,8}(남|여)/); if(g) out.gender=g[1];
  out.address=firstOf('주소');
  out.notes=firstOf('특이사항');
  out.visaType=firstOf('비자 종류','비자종류');
  out.visaExpiry=hrNormDate(firstOf('체류기간 만료일','체류기간'));
  out.foreignRegNo=firstOf('외국인등록번호');
  // 섹션 캡처: 제목 줄 다음부터 다음 섹션 제목 전까지
  const heads=/^(\d+[.)]\s*)?(인적|학\s*력|경\s*력|자\s*격|특이|비상|기타|수상|어학|외국어|병역|비자|체류|외국인)/;
  const section=(startRe,skipRe)=>{
    let cap=false; const buf=[];
    for(const ln of lines){
      if(!cap&&startRe.test(ln)){ cap=true; continue; }
      if(cap){ if(skipRe&&skipRe.test(ln)) continue; if(heads.test(ln)) break; buf.push(ln); }
    }
    return buf;
  };
  const yearTail=s=>{ const m=s.match(/((?:19|20)\d{2})(?!.*(?:19|20)\d{2})/); return m?m[1]:''; };
  // 학력: 학교명 전공 졸업연도 × 여러 줄
  const edus=[];
  section(/^(\d+[.)]\s*)?학\s*력/,/^학교명/).forEach(ln=>{
    const y=yearTail(ln); let rest=y?ln.slice(0,ln.lastIndexOf(y)):ln;
    rest=rest.replace(/[\s.\-~()]+$/,'').trim();
    if(!rest&&!y) return;
    const parts=rest.split(/\s+/);
    edus.push({school:parts[0]||'',major:parts.slice(1).join(' '),year:y});
  });
  if(edus.length) out.edus=edus;
  else{ // 자유형식 이력서: 라벨 기반으로 1건이라도
    const s=firstOf('학교명','최종학력'), mj=firstOf('전공');
    const gy=firstOf('졸업연도','졸업'); const gym=gy&&gy.match(/(?:19|20)\d{2}/);
    if(s||mj||gym) out.edus=[{school:s,major:mj,year:gym?gym[0]:''}];
  }
  // 자격증: 자격증명 취득연도 × 여러 줄
  const certs=[];
  section(/^(\d+[.)]\s*)?자\s*격/,/^자격증명/).forEach(ln=>{
    const y=yearTail(ln); let rest=y?ln.slice(0,ln.lastIndexOf(y)):ln;
    rest=rest.replace(/[\s.\-~()]+$/,'').trim();
    if(!rest) return;
    certs.push({name:rest,year:y});
  });
  if(certs.length) out.certList=certs;
  else{ const c=firstOf('자격증','자격사항'); if(c) out.certList=[{name:c,year:''}]; }
  // 경력: 원문 그대로
  const car=section(/^(\d+[.)]\s*)?경\s*력/,/^회사명/);
  if(car.length) out.career=car.join('\n');
  return out;
}

  }

  }
  const F=k=>(form[k]===undefined||form[k]===null)?'':form[k];

          orphans.map(r=>E('div',{key:r.rid,style:{display:'flex',alignItems:'center',gap:10,padding:'6px 0',borderBottom:'1px solid #f8fafc',fontSize:12}},
            E('span',{style:{color:'#64748b',minWidth:78}},r.date),
            E('span',{style:{fontWeight:500,minWidth:56}},r.empName||'(미상)'),
            E('span',{className:'badge '+(HR_KIND_BADGE[r.kind]||'b-gray')},r.kind),
            E('span',{style:{flex:1}},r.content),
            E('button',{className:'btn sm dng',onClick:()=>delRecord(r)},'삭제')))),
        E('div',{style:{fontSize:11,color:'#94a3b8',marginTop:12,lineHeight:1.7}},
          '* 이력서 PDF는 정보만 읽고 파일은 저장하지 않습니다. 원본은 NAS 폴더에 보관하세요.',E('br'),
          '* 표준 양식이 아닌 과거 이력서는 일부만 자동 인식되므로 나머지는 직접 입력하세요.',E('br'),
          '* 인사기록은 직원 삭제 후에도 이름과 함께 보관됩니다.'))),
    selEmp&&emp&&E(HrPrint,{emp,form,recs:empRecs}));
}

// ── 출근·식비 탭 (관리자/경리 전용) ──
// 평일은 전원 정상근무(중식 1식)로 자동 가정하고, 예외(잔업·결근·휴일근무·회사 식사 제공)만 입력한다.
// 연차·시간차는 연차 기록에서, 토·공휴일은 공휴일 표에서 자동 반영된다. 데이터 키: meal_YYYY-MM
function MealTab({emps,leaves}){
  const now=new Date();
  const [cur,setCur]=useState(new Date(now.getFullYear(),now.getMonth(),1));
  const y=cur.getFullYear(), m=cur.getMonth();
  const ymKey=y+'-'+String(m+1).padStart(2,'0');
  const daysInMonth=new Date(y,m+1,0).getDate();
  const [att,setAtt]=useState({});
  const [loaded,setLoaded]=useState(false);
  const [selDate,setSelDate]=useState(()=>{const t=ymd(now);return t;});
  const [xmsg,setXmsg]=useState(null);

  const [prevAtt,setPrevAtt]=useState({}); // 전월 데이터 (월초 1일의 '숙박 다음날 조식' 판정용)
  const prevLastDs=ymd(new Date(y,m,0));   // 전월 마지막 날
  useEffect(()=>{
    let un; setLoaded(false);
    (async()=>{
      const v=await dbGet('meal_'+ymKey);
      const pm=new Date(y,m-1,1);
      const pv=await dbGet('meal_'+pm.getFullYear()+'-'+String(pm.getMonth()+1).padStart(2,'0'));
      setAtt(v||{}); setPrevAtt(pv||{}); setLoaded(true);
      un=dbListen('meal_'+ymKey,d=>setAtt(d||{}));
    })();
    return ()=>{ un&&un(); };
  },[ymKey]);

  const activeEmps=emps.filter(e=>e.status!=='resigned');
  const isHol=(ds,dt)=>{const w=dt.getDay();return w===0||w===6||!!HOLIDAYS[ds];};
  // 승인된 연차 → 날짜별 맵 {dateStr:{empId:{full,hours}}}
  const lvMap={};
  leaves.filter(l=>l.status==='approved'&&!l.daysOnly&&l.start).forEach(l=>{
    if(l.type==='hour'){
      const mm=lvMap[l.start]=lvMap[l.start]||{};
      const c=mm[l.emp]=mm[l.emp]||{full:false,hours:0};
      c.hours=(c.hours||0)+(l.hours||Math.round((l.days||0)*HPD));
    } else {
      let d=new Date(l.start); const end=new Date(l.end||l.start);
      while(d<=end){ const ds=ymd(d); const mm=lvMap[ds]=lvMap[ds]||{}; mm[l.emp]={...(mm[l.emp]||{}),full:true}; d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1); }
    }
  });
  const entOf=(empId,ds)=>(att[empId]||{})[ds];
  const lvOf=(empId,ds)=>(lvMap[ds]||{})[empId];
  async function setEntry(empId,ds,patch){
    const mo={...att}; const em={...(mo[empId]||{})};
    const c={...(em[ds]||{}),...patch};
    Object.keys(c).forEach(k=>{ if(!c[k]) delete c[k]; });
    if(Object.keys(c).length===0) delete em[ds]; else em[ds]=c;
    if(Object.keys(em).length===0) delete mo[empId]; else mo[empId]=em;
    setAtt(mo); await dbSet('meal_'+ymKey,mo);
  }
  // 전날 숙박 여부 (1일이면 전월 마지막 날 확인)
  function prevStayOf(empId,d){
    if(d>1){ const pds=ymKey+'-'+String(d-1).padStart(2,'0'); const pe=entOf(empId,pds); return !!(pe&&pe.sb); }
    const pe=(prevAtt[empId]||{})[prevLastDs]; return !!(pe&&pe.sb);
  }
  function dayCell(emp,d){
    const ds=ymKey+'-'+String(d).padStart(2,'0');
    const dt=new Date(y,m,d);
    return mealCalc(emp,isHol(ds,dt),lvOf(emp.id,ds),entOf(emp.id,ds),prevStayOf(emp.id,d));
  }
  function monthStats(emp){
    let meals=0,workD=0,eoH=0,otH=0,whH=0,btD=0;
    for(let d=1;d<=daysInMonth;d++){
      const ds=ymKey+'-'+String(d).padStart(2,'0');
      const dt=new Date(y,m,d), hol=isHol(ds,dt);
      const lv=lvOf(emp.id,ds), ent=entOf(emp.id,ds);
      meals+=mealCalc(emp,hol,lv,ent,prevStayOf(emp.id,d)).meals;
      if(ent&&(ent.bt||ent.sb)) btD++; // 출장일수 (당일·숙박 모두, ×출장비 계산용)
      if(hol){
        if(ent&&(Number(ent.wh)>0||Number(ent.ot)>0||ent.bt||ent.sb)) workD++;
        if(ent){ otH+=Number(ent.ot)||0; whH+=Number(ent.wh)||0; }
      }
      else {
        if(!(ent&&ent.absent)&&!(lv&&lv.full)) workD++;
        if(ent){ eoH+=Number(ent.eo)||0; otH+=Number(ent.ot)||0; }
      }
    }
    const r1=v=>Math.round(v*10)/10;
    const remain=balance(emp,leaves).remain; // 잔여연차 (연차 시스템 실시간 연동)
    return {meals,workD,eoH:r1(eoH),otH:r1(otH),whH:r1(whH),btD,remain,amount:meals*MEAL_PRICE};
  }
  async function exportXlsx(){
    try{
      setXmsg({t:'엑셀 생성 중...',c:'#64748b'});
      const X=await loadXlsx();
      const days=[]; for(let d=1;d<=daysInMonth;d++) days.push(d);
      // 급여명세서에 인원별로 오려 붙일 수 있도록, 각 인원 위에 월일 헤더를 반복한다
      const headRow=[(m+1)+'월',...days.map(d=>d+'일'),'출근','조출h','잔업h','휴일h','출장일','잔여연차','식수','식비(원)'];
      const rows=[];
      activeEmps.forEach(e=>{
        const st=monthStats(e);
        rows.push(headRow);
        rows.push([e.name,...days.map(d=>dayCell(e,d).code),
          st.workD,st.eoH,st.otH,st.whH,st.btD,fmtDays(st.remain),st.meals,st.amount]);
      });
      const total=activeEmps.reduce((s,e)=>{const st=monthStats(e);return {meals:s.meals+st.meals,amt:s.amt+st.amount};},{meals:0,amt:0});
      const aoa=[['출근대장 '+y+'년 '+(m+1)+'월  (1식 '+MEAL_PRICE.toLocaleString()+'원 · ○정상 조n:조출(2h↑조식) 잔n:잔업 시n:시간차 연:연차 결:결근 출:출장 박:숙박(석식+익일조식) 휴n:휴일근무 /:휴무)'],...rows,
        [],['합계',...days.map(()=>''),'','','','','','',total.meals,total.amt]];
      const ws=X.utils.aoa_to_sheet(aoa);
      const wb=X.utils.book_new(); X.utils.book_append_sheet(wb,ws,ymKey);
      X.writeFile(wb,'출근대장_'+ymKey+'.xlsx');
      setXmsg({t:'엑셀 파일이 다운로드되었습니다.',c:'#166534'});
    }catch(e){ console.error(e); setXmsg({t:'엑셀 내보내기 실패: '+e.message,c:'#dc2626'}); }
  }
  const shift=n=>{const nd=new Date(y,m+n,1);setCur(nd);setSelDate(ymd(nd));};

  if(!loaded) return E('div',{style:{color:'#94a3b8',padding:20}},'출근 데이터 불러오는 중...');

  // ── 일별 입력 패널 ──
  const selDt=new Date(selDate+'T00:00:00');
  const selValid=!isNaN(selDt)&&selDt.getFullYear()===y&&selDt.getMonth()===m;
  const selHol=selValid&&isHol(selDate,selDt);
  const dailyPanel=E('div',{className:'card'},
    E('div',{className:'card-hdr'},'✏️ 일별 입력',
      E('input',{type:'date',className:'inp',style:{width:150},value:selDate,
        onChange:e=>{const v=e.target.value; if(!v) return; setSelDate(v); const nd=new Date(v+'T00:00:00'); if(nd.getFullYear()!==y||nd.getMonth()!==m) setCur(new Date(nd.getFullYear(),nd.getMonth(),1));}})),
    E('div',{className:'card-bd'},
      !selValid?E('div',{style:{color:'#94a3b8',fontSize:12}},'날짜를 선택하세요.')
      :E(React.Fragment,null,
        E('div',{style:{fontSize:12,marginBottom:10,color:selHol?'#dc2626':'#64748b'}},
          selDate+' ('+['일','월','화','수','목','금','토'][selDt.getDay()]+') '
          +(HOLIDAYS[selDate]?'· '+HOLIDAYS[selDate]+' ':'')
          +(selHol?'— 휴일: 근무한 사람만 시간을 입력하세요 (현장 5시간 이상 1식, 사무실 출근 시 1식)':'— 평일: 기본 정상근무(1식). 예외만 체크하세요')),
        E('div',{style:{overflowX:'auto'}},
          E('table',null,
            E('thead',null,E('tr',null,
              ['이름','자동 반영',...(selHol?['근무시간(h)','잔업(h)','출장','숙박','회사 중식','회사 석식','석식 영수증']:['조출(h)','잔업(h)','결근','출장','숙박','회사 중식','회사 석식','석식 영수증']),'판정'].map(h=>E('th',{key:h},h)))),
            E('tbody',null,activeEmps.map(e=>{
              const ent=entOf(e.id,selDate)||{};
              const lv=lvOf(e.id,selDate);
              const r=mealCalc(e,selHol,lv,ent,prevStayOf(e.id,selDt.getDate()));
              const auto=lv?(lv.full?'연차':'시간차 '+lv.hours+'h'):(e.isDorm?'기숙사':'')+(e.isOffice?(e.isDorm?'·':'')+'사무실':'');
              const chk=(key)=>E('input',{type:'checkbox',checked:!!ent[key],onChange:ev=>setEntry(e.id,selDate,{[key]:ev.target.checked?1:0})});
              const hrs=(key)=>E('input',{type:'number',min:0,max:12,step:0.5,className:'inp',style:{width:64},value:ent[key]||'',placeholder:'0',
                onChange:ev=>setEntry(e.id,selDate,{[key]:ev.target.value===''?0:Number(ev.target.value)})});
              return E('tr',{key:e.id},
                E('td',{style:{fontWeight:500}},e.name),
                E('td',{style:{color:'#94a3b8',fontSize:11}},auto||'-'),
                selHol
                  ? E(React.Fragment,null,
                      E('td',null,E('input',{type:'number',min:0,max:24,step:0.5,className:'inp',style:{width:70},value:ent.wh||'',placeholder:'0',
                        onChange:ev=>setEntry(e.id,selDate,{wh:ev.target.value===''?0:Number(ev.target.value)})})),
                      E('td',null,hrs('ot')),
                      E('td',{style:{textAlign:'center'}},chk('bt')),
                      E('td',{style:{textAlign:'center'}},chk('sb')),
                      E('td',{style:{textAlign:'center'}},chk('cl')),
                      E('td',{style:{textAlign:'center'}},chk('cd')),
                      E('td',{style:{textAlign:'center'}},e.isOffice?chk('rc'):E('span',{style:{color:'#cbd5e1'}},'–')))
                  : E(React.Fragment,null,
                      E('td',null,hrs('eo')),
                      E('td',null,hrs('ot')),
                      E('td',{style:{textAlign:'center'}},chk('absent')),
                      E('td',{style:{textAlign:'center'}},chk('bt')),
                      E('td',{style:{textAlign:'center'}},chk('sb')),
                      E('td',{style:{textAlign:'center'}},chk('cl')),
                      E('td',{style:{textAlign:'center'}},chk('cd')),
                      E('td',{style:{textAlign:'center'}},e.isOffice?chk('rc'):E('span',{style:{color:'#cbd5e1'}},'–'))),
                E('td',{style:{textAlign:'center',fontWeight:600,color:r.meals>0?'#166534':'#94a3b8'}},r.meals+'식'));
            }))))
      )));

  // ── 월간 대장 ──
  const days=[]; for(let d=1;d<=daysInMonth;d++) days.push(d);
  const totals=activeEmps.map(e=>monthStats(e));
  const grand=totals.reduce((s,t)=>({meals:s.meals+t.meals,amt:s.amt+t.amount}),{meals:0,amt:0});
  const grid=E('div',{className:'card'},
    E('div',{className:'card-hdr'},
      E('span',null,
        E('button',{className:'btn sm',onClick:()=>shift(-1)},'‹'),
        E('span',{style:{margin:'0 10px'}},y+'년 '+(m+1)+'월 출근대장'),
        E('button',{className:'btn sm',onClick:()=>shift(1)},'›'),
        E('button',{className:'btn sm',style:{marginLeft:6},onClick:()=>{setCur(new Date(now.getFullYear(),now.getMonth(),1));setSelDate(ymd(now));}},'오늘')),
      E('span',{style:{display:'flex',gap:8}},
        E('button',{className:'btn sm',onClick:exportXlsx},'📊 엑셀'),
        E('button',{className:'btn sm',onClick:printLandscape},'🖨️ 인쇄'))),
    E('div',{className:'card-bd'},
      E('div',{style:{fontSize:11,color:'#94a3b8',marginBottom:8}},
        '○ 정상(1식, 기숙사는 석식 포함 2식) · 조n 조출 n시간(2h 이상 조식) · 잔n 잔업 n시간(석식, 사무실은 영수증 증빙 시) · 시n 시간차(3h 이내 1식) · 연 연차 · 결 결근 · 출 출장(기록·일수 집계만, 식비는 평소 규칙) · 박 숙박(그날 석식+다음날 조식) · 휴n잔n 휴일근무·잔업 · / 휴무 — 평일은 기본 정상근무로 계산되며, 사무실/기숙사 구분은 직원·기록 관리에서 설정합니다.'),
      xmsg&&E('div',{style:{fontSize:12,marginBottom:8,color:xmsg.c}},xmsg.t),
      E('div',{style:{overflowX:'auto'}},
        E('table',{className:'mg'},
          E('thead',null,E('tr',null,
            E('th',{className:'nm'},'이름'),
            days.map(d=>{const ds=ymKey+'-'+String(d).padStart(2,'0');const dt=new Date(y,m,d);const hol=isHol(ds,dt);
              return E('th',{key:d,className:hol?'we':'',style:{color:dt.getDay()===0||HOLIDAYS[ds]?'#dc2626':dt.getDay()===6?'#2563eb':undefined}},d);}),
            ['출근','조출h','잔업h','휴일h','출장','잔여연차','식수','식비'].map(h=>E('th',{key:h},h)))),
          E('tbody',null,activeEmps.map((e,i)=>{
            const st=totals[i];
            return E('tr',{key:e.id},
              E('td',{className:'nm'},e.name),
              days.map(d=>{const ds=ymKey+'-'+String(d).padStart(2,'0');const dt=new Date(y,m,d);const hol=isHol(ds,dt);
                const r=dayCell(e,d);
                return E('td',{key:d,className:hol?'we':'',style:{cursor:'pointer'},title:e.name+' '+ds,onClick:()=>setSelDate(ds)},r.code);}),
              E('td',{className:'tot'},st.workD),
              E('td',{className:'tot'},st.eoH||''),
              E('td',{className:'tot'},st.otH||''),
              E('td',{className:'tot'},st.whH||''),
              E('td',{className:'tot'},st.btD||''),
              E('td',{className:'tot'},fmtDays(st.remain)),
              E('td',{className:'tot'},st.meals),
              E('td',{className:'tot'},st.amount.toLocaleString()));
          }),
          E('tr',null,
            E('td',{className:'nm',style:{fontWeight:700}},'합계'),
            E('td',{colSpan:daysInMonth}),
            E('td',{className:'tot'},''),E('td',{className:'tot'},''),E('td',{className:'tot'},''),E('td',{className:'tot'},''),E('td',{className:'tot'},''),E('td',{className:'tot'},''),
            E('td',{className:'tot'},grand.meals),
            E('td',{className:'tot'},grand.amt.toLocaleString()))))),
      E('div',{style:{fontSize:11,color:'#94a3b8',marginTop:8}},'날짜 칸을 클릭하면 그 날짜가 일별 입력에 선택됩니다. 1식 '+MEAL_PRICE.toLocaleString()+'원 · 이번 달 합계 '+grand.meals+'식 = '+grand.amt.toLocaleString()+'원')));

  return E(React.Fragment,null,grid,dailyPanel,
    E(MealPrint,{y,m,daysInMonth,activeEmps,dayCell,totals,grand,isHol,ymKey}));
}

// 인쇄용 월간 출근대장 (노무사 제출용, 가로 출력)
function MealPrint({y,m,daysInMonth,activeEmps,dayCell,totals,grand,isHol,ymKey}){
  const days=[]; for(let d=1;d<=daysInMonth;d++) days.push(d);
  const th={border:'0.5px solid #888',background:'#f1efe8',padding:'3px 2px',fontSize:9,textAlign:'center'};
  const td={border:'0.5px solid #888',padding:'3px 2px',fontSize:9,textAlign:'center'};
  // 각 인원 위에 월일 헤더를 반복 → 급여명세서에 인원별로 오려 붙일 수 있음
  const headRow=key=>E('tr',{key},
    E('th',{style:{...th,minWidth:44}},(m+1)+'월'),
    days.map(d=>{const ds=ymKey+'-'+String(d).padStart(2,'0');const dt=new Date(y,m,d);
      return E('th',{key:d,style:{...th,color:dt.getDay()===0||HOLIDAYS[ds]?'#c00':dt.getDay()===6?'#04c':undefined}},d);}),
    ['출근','조출h','잔업h','휴일h','출장','잔여연차','식수','식비(원)'].map(h=>E('th',{key:h,style:th},h)));
  return E('div',{id:'print-area',className:'print-only',style:{padding:'0.5rem',background:'#fff'}},
    E('div',{style:{textAlign:'center',fontSize:20,fontWeight:700,letterSpacing:6,marginBottom:2}},'출 근 대 장'),
    E('div',{style:{textAlign:'center',fontSize:11,color:'#444',marginBottom:8}},'㈜케이엠제이 · '+y+'년 '+(m+1)+'월 · 출력일 '+today()),
    E('table',{style:{width:'100%',borderCollapse:'collapse'}},
      E('tbody',null,
        activeEmps.flatMap((e,i)=>{
          const st=totals[i];
          return [
            headRow('h'+e.id),
            E('tr',{key:e.id},
              E('td',{style:{...td,fontWeight:600}},e.name),
              days.map(d=>E('td',{key:d,style:td},dayCell(e,d).code)),
              E('td',{style:td},st.workD),E('td',{style:td},st.eoH||''),E('td',{style:td},st.otH||''),E('td',{style:td},st.whH||''),E('td',{style:td},st.btD||''),E('td',{style:td},fmtDays(st.remain)),
              E('td',{style:td},st.meals),E('td',{style:td},st.amount.toLocaleString()))
          ];
        }).concat([
        E('tr',{key:'sum'},
          E('td',{style:{...th,fontWeight:700}},'합계'),
          E('td',{style:td,colSpan:daysInMonth}),
          E('td',{style:td},''),E('td',{style:td},''),E('td',{style:td},''),E('td',{style:td},''),E('td',{style:td},''),E('td',{style:td},''),
          E('td',{style:{...td,fontWeight:700}},grand.meals),
          E('td',{style:{...td,fontWeight:700}},grand.amt.toLocaleString()))]))),
